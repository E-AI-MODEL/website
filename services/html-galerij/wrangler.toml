name = "eai-html-galerij"
main = "src/index.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "eai-html-galerij"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "HTML_FILES"
bucket_name = "eai-html-galerij"

[vars]
ALLOWED_ORIGIN = "https://eaimodel.nl"
