name: Publish Vakinhoud navigation
# Manual-only targeted recovery. A regular main push uses the complete
# Deploy to Theory7 release and verifies the exact published site.
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build published navigation
        run: |
          pip install beautifulsoup4
          python scripts/build_site.py --sources content/legacy --out site-build
          python scripts/prepare_ui.py --root site-build
          python - <<'PY'
          from pathlib import Path
          for path,expected in {
            'site-build/nl/index.html': 'Zelf aan de slag',
            'site-build/en/index.html': 'Explore & create',
            'site-build/nl/tools/index.html': 'Waar wil je mee aan de slag?',
            'site-build/en/tools/index.html': 'What would you like to explore?',
            'site-build/tools/science-observatory/index.html': 'Natuurkunde en wiskunde',
          }.items():
            text=Path(path).read_text(encoding='utf-8')
            assert expected in text, (path,expected)
            assert 'Proeven & simulaties' not in text, path
            if 'nl/tools/' in path or 'en/tools/' in path:
              assert 'href="#vak-oceanografie"' in text, path
              assert 'href="/tools/melkweg-lab/"' in text, path
          PY
      - name: Leg de vooraf gecontroleerde overdrachtsbestanden vast
        run: python3 scripts/recovery_files.py create site-build/assets site-build/en/index.html site-build/en/tools/index.html site-build/nl/index.html site-build/nl/tools/index.html site-build/tools/science-observatory/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-files/
            recovery-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: prepare
    environment: theory7-herstel
    concurrency:
      group: theory7-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Controleer de goedkeuring van de eigenaar
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e --arg id "$OWNER_ID" 'any(.[]; .state == "approved" and (.user.id|tostring) == $id and any(.environments[]; .name == "theory7-herstel"))'
      - uses: actions/download-artifact@v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
      - run: python3 scripts/recovery_files.py verify
      - run: cp -a recovery-files/. .
      - name: Install FTPS tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp openssl
      - name: Verify FTPS fingerprint
        shell: bash
        run: |
          set -euo pipefail
          fp="$(openssl s_client -starttls ftp -connect ftp.eaimodel.nl:21 -servername ftp.eaimodel.nl </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)"
          test "$fp" = "4D:F5:15:4C:F3:11:5E:5B:DD:91:BD:5F:BD:0F:0E:A7:35:71:5C:32"
      - name: Upload revised main pages without touching the other tools
        shell: bash
        env:
          FTP_USER: ${{ secrets.THEORY7_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.THEORY7_FTP_PASSWORD }}
        working-directory: recovery-files
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" ftp://ftp.eaimodel.nl:21 <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:timeout 20
          set net:max-retries 1
          set xfer:use-temp-file yes
          put site-build/nl/index.html -o /nl/index.html
          put site-build/en/index.html -o /en/index.html
          put site-build/nl/tools/index.html -o /nl/tools/index.html
          put site-build/en/tools/index.html -o /en/tools/index.html
          put site-build/tools/science-observatory/index.html -o /tools/science-observatory/index.html
          mirror -R --parallel=3 site-build/assets/ /assets/
          bye
          EOF
      - name: Verify revised public labels
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from time import sleep
          checks={
            '/nl/':b'Zelf aan de slag',
            '/en/':b'Explore & create',
            '/nl/tools/':b'Waar wil je mee aan de slag?',
            '/en/tools/':b'What would you like to explore?',
            '/tools/science-observatory/':b'Natuurkunde en wiskunde',
          }
          for path,word in checks.items():
            problem=None
            for attempt in range(5):
              try:
                request=Request('https://eaimodel.nl'+path+'?vakinhoud=20261115',headers={'Cache-Control':'no-cache'})
                with urlopen(request,timeout=25) as response:
                  page=response.read()
                  assert response.status==200,(path,response.status)
                  assert word in page,path
                  assert b'Proeven & simulaties' not in page,path
                  if path in ('/nl/tools/', '/en/tools/'):
                    assert b'href="#vak-oceanografie"' in page, path
                    assert b'href="/tools/melkweg-lab/"' in page, path
                print('LIVE:',path)
                problem=None
                break
              except Exception as error:
                problem=repr(error)
                if attempt<4:sleep(5)
            if problem:raise RuntimeError(path+': '+problem)
          PY
