name: CI workflow inventory and lint
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/ci_*.py'
      - 'scripts/ci_suites.json'
      - 'scripts/check_release_gate.py'
      - 'tests/test_ci_*.py'
      - 'tests/test_release_gate.py'
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline commit or ref
        type: string
        default: '878bfa368c4a23736725621feba7c919c0e49bd5'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE: ${{ github.event.pull_request.base.sha || inputs.baseline || '878bfa368c4a23736725621feba7c919c0e49bd5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory all workflow and composite action commands
        run: |
          python -m pip install PyYAML==6.0.2
          python scripts/ci_inventory.py --before "$BASE" --after HEAD --output ci-audit/inventory.json
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Compare baseline and current actionlint results
        shell: bash
        run: |
          set -euo pipefail
          actionlint="$(go env GOPATH)/bin/actionlint"
          "$actionlint" -version
          mkdir -p ci-audit "$RUNNER_TEMP/ci-baseline"
          git archive "$BASE" .github | tar -x -C "$RUNNER_TEMP/ci-baseline"
          (
            cd "$RUNNER_TEMP/ci-baseline"
            git init -q
            "$actionlint" -oneline .github/workflows/*.yml
          ) > ci-audit/actionlint-before.txt 2>&1 || true
          "$actionlint" -oneline .github/workflows/*.yml > ci-audit/actionlint-after.txt 2>&1 || true
          cat ci-audit/actionlint-before.txt
          cat ci-audit/actionlint-after.txt
          python - <<'PY'
          from pathlib import Path
          import re
          def findings(path):
              text = Path(path).read_text()
              text = re.sub(r"\x1b\[[0-9;]*m", "", text)
              return {re.sub(r":\d+:\d+:", ":", line.strip())
                      for line in text.splitlines() if line.strip()}
          old = findings("ci-audit/actionlint-before.txt")
          new = findings("ci-audit/actionlint-after.txt")
          introduced = sorted(new - old)
          print("Baseline findings:", len(old), "Current:", len(new))
          if introduced:
              print("New findings:", *introduced, sep="\n")
              raise SystemExit(1)
          PY
      - name: Store complete comparison and lint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-audit/
          if-no-files-found: error
          retention-days: 30
