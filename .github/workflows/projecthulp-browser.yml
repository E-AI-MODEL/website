name: EAIgit · gebruikersproef
on:
  workflow_call:
  workflow_dispatch:


permissions:
  contents: read
jobs:
  golden-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controleer ZIP, GitHub en adviesregels
        run: node --test tests/test_projecthulp.mjs tests/test_eaigit_help.mjs tests/test_eaigit_single_file.mjs tests/test_static_audit.mjs tests/test_audit_advice.mjs
      - name: Installeer browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Doorloop gebruikersroute op desktop en telefoon
        run: node scripts/test_projecthulp_browser.mjs .
      - name: Bewaar screenshots en advies voor beoordeling
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaigit-gebruikersproef
          path: |
            test-results/eaigit-*
          if-no-files-found: warn
