name: Controle dubbele publicatiepagina's

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check_publication_duplicates.py'
      - 'tests/test_publication_duplicates.py'
      - 'catalog/publication-page-overlaps.json'
      - '.github/workflows/publication-duplicates.yml'
      - '.github/workflows/deploy-theory7.yml'
      - 'scripts/build_site.py'
      - 'scripts/prepare_ui.py'
      - 'index.html'
      - 'nl/**'
      - 'en/**'
      - 'content/**'
      - 'tools/**'
      - '**/*.html'
  push:
    branches: [main]
    paths:
      - 'scripts/check_publication_duplicates.py'
      - 'tests/test_publication_duplicates.py'
      - 'catalog/publication-page-overlaps.json'
      - '.github/workflows/publication-duplicates.yml'
      - '.github/workflows/deploy-theory7.yml'
      - 'scripts/build_site.py'
      - 'scripts/prepare_ui.py'
      - 'index.html'
      - 'nl/**'
      - 'en/**'
      - 'content/**'
      - 'tools/**'
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-pages:
    name: Welke pagina komt online?
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HTML-parser installeren
        run: pip install beautifulsoup4
      - name: Controleer alle beslisregels met proefpagina's
        run: python -m unittest discover -s tests -p 'test_publication_duplicates.py' -v
      - name: Bouw de werkelijke publicatiepagina's
        run: |
          python scripts/build_site.py --sources content/legacy --out site-build
          python scripts/prepare_ui.py --root site-build
      - name: Toon dubbele URLs, canonieke pagina's en oude varianten
        run: |
          python scripts/check_publication_duplicates.py \
            --root site-build \
            --known catalog/publication-page-overlaps.json \
            --deferred /tools/anatomie/ \
            --deferred /tools/anatomie/labs/hartslag/ \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json "$RUNNER_TEMP/publication-duplicates.json"
      - name: Bewaar volledige publicatiecontrole
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publicatie-dubbele-paginas
          path: ${{ runner.temp }}/publication-duplicates.json
          if-no-files-found: warn
