name: Eenmalig opruimen van bewezen gemergede branches
on:
  push:
    branches: [audit/generated-source-ownership]
    paths: ['.github/workflows/cleanup-verified-ancestors.yml']

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  cleanup:
    if: github.repository == 'E-AI-MODEL/website' && github.actor == 'E-AI-MODEL' && github.event.before == 'c54c9d497754c5135e5619b99dcb871d8a48fc5f' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: verified-ancestor-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Retrieve the immutable read-only audit
        uses: actions/download-artifact@v4
        with:
          name: branch-backlog-45652888678-1
          run-id: 45652888678
          github-token: ${{ github.token }}
          path: prior-audit/
      - name: Revalidate and delete exact proven ancestors
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cleanup_verified_ancestors.py
      - name: Retain exact outcomes and restoration refs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-ancestor-cleanup-${{ github.run_id }}
          path: cleanup-evidence/
          if-no-files-found: error
          retention-days: 90
