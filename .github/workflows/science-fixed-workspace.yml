name: Test fixed physics laboratory
on:
  workflow_call:
    inputs:
      reuse_build:
        type: boolean
        default: false
      skip_duplicate_chromium:
        description: De centrale Chromium-matrix draait dezelfde proef op dezelfde build
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  physics-fixed:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - uses: ./.github/actions/checked-build
        with:
          reuse: ${{ inputs.reuse_build }}
      - name: Use the pinned browser runtime
        uses: ./.github/actions/browser-runtime
        with:
          binding: node
      - name: Mathematics viewport and navigation in Chromium
        run: node scripts/test_science_math_adaptive.mjs site-build chromium
      - name: Mathematics viewport and navigation in Safari
        run: node scripts/test_science_math_adaptive.mjs site-build webkit
      - name: All 53 labs fixed on screen in Chromium
        run: node scripts/test_science_fixed_workspace.mjs site-build chromium
      - name: All 53 labs fixed on screen in Safari
        run: node scripts/test_science_fixed_workspace.mjs site-build webkit
      - name: Mobile shooting and scale
        run: node scripts/test_science_mobile_aim.mjs site-build webkit
      - name: Compact studio and physics values
        if: ${{ !inputs.skip_duplicate_chromium }}
        run: node scripts/test_schuine_worp_studio.mjs site-build chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-physics-laboratory-screenshots-${{ github.run_attempt }}
          path: |
            test-results/physics-*.png
            test-results/math-*.png
            test-results/science-*.png
            test-results/worp-studio-*.png
