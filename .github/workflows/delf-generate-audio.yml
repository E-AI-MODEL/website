name: DELF generate French audio

on:
  push:
    branches:
      - fix/delf-bundled-french-audio-20261120
    paths:
      - 'tools/delf-live/scripts/generate_scene_audio.py'
      - '.github/workflows/delf-generate-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install French synthesis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          pip install 'kokoro==0.9.4' numpy soundfile
      - name: Make two French recordings
        run: python tools/delf-live/scripts/generate_scene_audio.py
      - name: Verify audio duration and output
        run: |
          set -euo pipefail
          for f in tools/delf-live/public/audio/*.mp3; do
            test -s "$f"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$f"
          done
          test -s tools/delf-live/public/audio/audio-manifest.json
      - name: Commit recordings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/delf-live/public/audio/
          git diff --cached --quiet || (git commit -m 'DELF: bundle both French scene recordings' && git push origin HEAD:${GITHUB_REF_NAME})
