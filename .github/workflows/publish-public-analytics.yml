name: Publish public website statistics

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: eai-public-analytics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check snapshot publication logic
        run: python -m unittest discover -s tests -p 'test_public_analytics.py' -v
      - name: Refresh aggregate data from Cloudflare
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SITE_TAG: ${{ secrets.CLOUDFLARE_SITE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ANALYTICS_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_SITE_TAG" ]]; then
            echo "::notice::Cloudflare Web Analytics is not connected. Add the three repository secrets."
            exit 1
          fi

          # Secrets are used only in the runner; the public JSON contains aggregates.
          python scripts/publish_web_analytics.py statistieken/data.json

      - run: python3 scripts/recovery_files.py create statistieken/data.json
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-files/
            recovery-manifest.json
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: refresh
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: theory7-herstel
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Controleer toestemming voor deze momentopname
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e --arg id "$OWNER_ID" 'any(.[]; .state == "approved" and (.user.id|tostring) == $id and any(.environments[]; .name == "theory7-herstel"))'
      - uses: actions/download-artifact@v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
      - run: python3 scripts/recovery_files.py verify && cp -a recovery-files/. .
      - name: Verify Theory7 FTPS certificate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp openssl
          expected="4D:F5:15:4C:F3:11:5E:5B:DD:91:BD:5F:BD:0F:0E:A7:35:71:5C:32"
          actual="$(openssl s_client -starttls ftp -connect ftp.eaimodel.nl:21 -servername ftp.eaimodel.nl </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Theory7 FTPS-certificaat komt niet overeen. Geen upload uitgevoerd."
            exit 1
          fi

      - name: Publish only the public statistics JSON to Theory7
        env:
          FTP_USER: ${{ secrets.THEORY7_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.THEORY7_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -s statistieken/data.json
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://ftp.eaimodel.nl:21" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:timeout 20
          set net:max-retries 1
          set xfer:use-temp-file yes
          mkdir -p /statistieken
          put statistieken/data.json -o /statistieken/data.json
          bye
          EOF

      - name: Verify the public dataset on Theory7
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import URLError
          expected = json.loads(Path('statistieken/data.json').read_text(encoding='utf-8'))
          url = 'https://eaimodel.nl/statistieken/data.json?verify=' + '${{ github.run_id }}'
          for attempt in range(6):
              try:
                  with urlopen(Request(url, headers={'Cache-Control': 'no-cache'}), timeout=25) as response:
                      published = json.loads(response.read(2_000_000))
                  if published == expected:
                      print('De echte Cloudflare-totalen staan op Theory7.')
                      break
              except (URLError, ValueError, TimeoutError) as error:
                  print(f'Openbare JSON nog niet bevestigd ({attempt + 1}/6): {type(error).__name__}')
              if attempt == 5:
                  raise SystemExit('Theory7-publicatie wijkt af van de Cloudflare-snapshot')
              time.sleep(8)
          PY
