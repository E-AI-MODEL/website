name: Controle inhoudsregister website

on:
  workflow_call:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  register:
    name: Pagina's, bronbestanden en onderdelen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer het website-register
        run: |
          python scripts/check_website_register.py
          python -m unittest discover -s tests -p 'test_website_register.py' -v
