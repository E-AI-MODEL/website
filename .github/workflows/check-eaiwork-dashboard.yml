name: Check EAIwork dashboard
on:
  workflow_call:
    inputs:
      reuse_build:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python build dependency
        run: python -m pip install beautifulsoup4
      - uses: ./.github/actions/checked-build
        with:
          reuse: ${{ inputs.reuse_build }}
      - name: Check dashboard source and route
        run: python -m unittest discover -s tests -p 'test_eaiwork_dashboard_publish.py' -v
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Test compact dashboard on desktop and mobile
        run: node scripts/test_eaiwork_mobile.mjs site-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eaiwork-dashboard-screenshots
          path: test-results/eaiwork-dashboard-*.png
          if-no-files-found: ignore
