name: Astronomy scientific benchmark
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tests/requirements-astronomy.txt
      - run: python scripts/validate_astronomy.py
      - run: python scripts/check_astronomy_baseline.py test-results/astronomy/report.json
      - name: Summarize all observations
        if: always()
        run: |
          if test -f test-results/astronomy/report.md; then
            cat test-results/astronomy/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astronomy-validation-${{ github.run_attempt }}
          path: test-results/astronomy/
          if-no-files-found: warn
