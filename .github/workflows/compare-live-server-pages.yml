name: Vergelijk FTP-server met websitebuild

on:
  # Tijdelijke proef op de eigen branch. Na de controle blijft
  # uitsluitend workflow_dispatch over.
  push:
    branches:
      - feat/publication-page-duplicate-gate-20261120
    paths:
      - 'scripts/compare_published_pages.py'
      - 'tests/test_compare_published_pages.py'
      - '.github/workflows/compare-live-server-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'E-AI-MODEL/website'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test veilige vergelijking
        run: |
          python -m pip install beautifulsoup4
          python -m unittest discover -s tests -p 'test_compare_published_pages.py' -v
      - name: Bouw dezelfde site als bij publicatie
        run: |
          python scripts/build_site.py --sources content/legacy --out site-build
          python scripts/build_anatomie.py --out site-build/tools/anatomie
          python scripts/prepare_ui.py --root site-build
      - name: Installeer FTPS-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp openssl
      - name: Controleer FTPS-certificaat voordat de server wordt benaderd
        shell: bash
        run: |
          set -euo pipefail
          expected="4D:F5:15:4C:F3:11:5E:5B:DD:91:BD:5F:BD:0F:0E:A7:35:71:5C:32"
          actual="$(openssl s_client -starttls ftp -connect ftp.eaimodel.nl:21 -servername ftp.eaimodel.nl </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)"
          test "$actual" = "$expected" || { echo 'Het FTPS-certificaat is anders. Stop.'; exit 1; }
      - name: Lees alleen bestandsnamen op productie
        env:
          FTP_USER: ${{ secrets.THEORY7_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.THEORY7_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          # Geen mirror, get, put, rm of andere wijzigende FTPS-opdracht.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://ftp.eaimodel.nl:21" <<'EOF' > "$RUNNER_TEMP/server-file-list.txt"
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:timeout 20
          set net:max-retries 1
          find -d 10 /
          bye
          EOF
          test -s "$RUNNER_TEMP/server-file-list.txt"
      - name: Vergelijk server met de nieuwe website
        shell: bash
        run: |
          python scripts/compare_published_pages.py \
            --root site-build \
            --listing "$RUNNER_TEMP/server-file-list.txt" \
            --http-limit 35 \
            --json "$RUNNER_TEMP/server-versus-build.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Bewaar alleen het gefilterde rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftp-vs-publicatie-html
          path: ${{ runner.temp }}/server-versus-build.json
          if-no-files-found: warn
