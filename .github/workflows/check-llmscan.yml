name: Check standalone LLMscan
on:
  pull_request:
    branches: [main]
    paths:
      - 'nl/llmscan/**'
      - 'tests/test_llmscan_standalone.py'
      - 'scripts/test_llmscan_browser.mjs'
      - '.github/workflows/check-llmscan.yml'
  push:
    branches:
      - 'feat/standalone-llmscan-20261113'
    paths:
      - 'nl/llmscan/**'
      - 'tests/test_llmscan_standalone.py'
      - '.github/workflows/check-llmscan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check nl/llmscan/catalogue.js
          node --check nl/llmscan/app.js
          node --check nl/llmscan/updates.js
      - name: Check original catalogue and research
        run: python -m unittest discover -s tests -p 'test_llmscan_standalone.py' -v
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Test actual LLMscan interaction on phone and desktop
        run: node scripts/test_llmscan_browser.mjs
