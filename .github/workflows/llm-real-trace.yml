name: Record real tiny LLM activations
# Heavy model inference runs only on deliberate manual request, not every PR commit.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install transformers==4.49.0 huggingface_hub==0.34.4 safetensors==0.5.3
      - name: Capture real values from trained public GPT-Neo model
        run: python scripts/generate_llm_real_trace.py --out artifacts/tinystories-real-trace.json
      - name: Validate model trace before releasing the artifact
        run: python scripts/test_llm_real_trace.py artifacts/tinystories-real-trace.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-llm-trace
          path: artifacts/tinystories-real-trace.json
          if-no-files-found: error
