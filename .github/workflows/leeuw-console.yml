name: Leeuw vaste onderzoeksconsole
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use the pinned browser runtime
        uses: ./.github/actions/browser-runtime
        with:
          binding: node
      - name: Verify the selected browser exists and run all scenarios
        env:
          ENGINE: ${{ matrix.engine }}
          DEBUG: ${{ matrix.engine == 'webkit' && 'pw:browser' || '' }}
        run: |
          node -e 'const fs=require("node:fs"); const browser=require("playwright")[process.env.ENGINE]; if(!browser||!fs.existsSync(browser.executablePath())) throw Error("Selected browser is absent from pinned image");'
          # Headless Linux CI has no physical GPU. Avoid choosing a Vulkan
          # driver that cannot create its instance on this runner.
          if [ "$ENGINE" = webkit ]; then
            export LIBGL_ALWAYS_SOFTWARE=1
            export GALLIUM_DRIVER=llvmpipe
          fi
          # GitHub mounts /github/home for pwuser, but this container runs as root.
          # Firefox refuses to start with a HOME owned by another user.
          if [ "$ENGINE" = firefox ]; then
            export HOME=/root
            if [ ! -d "$HOME" ] || [ ! -O "$HOME" ] || [ ! -w "$HOME" ]; then
              echo "::error::Firefox HOME must exist and be owned and writable by the running user (uid=$(id -u))"
              exit 1
            fi
          fi
          node scripts/test_leeuw_console.mjs . "$ENGINE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leeuw-${{ matrix.engine }}-screenshots-${{ github.run_attempt }}
          path: test-results/leeuw-*.png
