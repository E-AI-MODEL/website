name: Leeuw vaste onderzoeksconsole
on:
  workflow_call:
    inputs:
      reuse_build:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/checked-build
        with:
          reuse: ${{ inputs.reuse_build }}
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node scripts/test_leeuw_console.mjs site-build ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leeuw-${{ matrix.engine }}-screenshots
          path: test-results/leeuw-*.png
