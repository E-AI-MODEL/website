name: Leeuw vaste onderzoeksconsole
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node scripts/test_leeuw_console.mjs . ${{ matrix.engine }}
        env:
          DEBUG: ${{ matrix.engine == 'webkit' && 'pw:browser' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leeuw-${{ matrix.engine }}-screenshots-${{ github.run_attempt }}
          path: test-results/leeuw-*.png
