name: Diagnose retired projectile live hash (read only)
on:
  push:
    branches: [audit/generated-source-ownership]
    paths: ['.github/workflows/diagnose-projectile-live-hash.yml']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'E-AI-MODEL/website' && github.event.before == 'ba2f1b0e3ff0a0e8506de2a8a29e7a1f88295fc2' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7e97e43b8634f3308e974ccd385973ef50c4e81a
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: site-release-45700853780-1
          run-id: 45700853780
          github-token: ${{ github.token }}
          path: candidate
      - run: python -m pip install beautifulsoup4
      - name: Compare live bytes with exact checked build
        run: |
          GITHUB_RUN_ID=45700853780 BUILD_ATTEMPT=1 python scripts/release_artifact.py verify --root candidate/site-build --manifest candidate/release-manifest.json --commit 7e97e43b8634f3308e974ccd385973ef50c4e81a
          python - <<'PY'
          import hashlib, json, sys, time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          sys.path.insert(0, "scripts")
          from verify_ui import html_matches_release

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect())
          base = "https://eaimodel.nl"
          old = "/tools/science-observatory/labs/schuine-worp/"
          keep = "/tools/science-observatory/labs/natuurkunde/"
          expected = (Path("candidate/site-build") / keep.strip("/") / "index.html").read_bytes()
          digest = hashlib.sha256(expected).hexdigest()
          def fetch(path):
              req = Request(base + path + "?release-audit=" + str(time.time_ns()),
                            headers={"Cache-Control": "no-cache", "User-Agent": "EAI-release-check/1.0"})
              try:
                  with opener.open(req, timeout=30) as response:
                      return response.status, response.read()
              except HTTPError as exc:
                  return exc.code, b""
          status, actual = fetch(keep)
          matched, beacon = html_matches_release(actual, digest)
          result = {"old_routes": {path: fetch(path)[0] for path in (old, old + "index.html")},
                    "kept_status": status, "expected_sha256": digest,
                    "live_sha256": hashlib.sha256(actual).hexdigest(),
                    "expected_bytes": len(expected), "live_bytes": len(actual),
                    "exact": actual == expected, "matches_existing_strict_verifier": matched,
                    "known_cloudflare_beacon_only": matched and beacon}
          print(json.dumps(result, indent=2), flush=True)
          with open("live-hash-diagnosis.json", "w") as f:
              json.dump(result, f, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projectile-live-hash-diagnosis
          path: live-hash-diagnosis.json
          if-no-files-found: error
          retention-days: 30
