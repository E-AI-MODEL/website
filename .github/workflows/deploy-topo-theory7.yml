name: Deploy TOPO independently
on:
  workflow_run:
    workflows: [Valideer de publicatieversie]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_run:
        description: Alleen voor herstel; runnummer van de geslaagde hoofdversie
        type: string
        required: true
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: topo-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: topo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer vertrouwde workflow, tests, bronboom en bestandshashes
        id: release
        env:
          VALIDATION_RUN: ${{ github.event.workflow_run.id || inputs.validation_run }}
        run: python scripts/release_candidate.py "$VALIDATION_RUN" "$TARGET"
      - name: Registreer de upload onder de bestaande publicatiewachtrij
        id: deployment
        env:
          TREE: ${{ steps.release.outputs.tree }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: python scripts/release_deployment.py begin
      - name: Check TOPO sources and nationwide map
        if: steps.deployment.outputs.id != ''
        run: |
          set -euo pipefail
          test -s candidate/topo/index.html
          test -s candidate/topo/instellingen/index.html
          test -s candidate/topo/nederland/index.html
          test -s candidate/topo/data/provincies-2026.geojson
          test -s candidate/topo/vo/index.html
          test -s candidate/topo/vo/spel/index.html
          test -s candidate/topo/data/vo/sets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('candidate/topo')
          geo = json.loads((root / 'data/provincies-2026.geojson').read_text())
          assert len(geo['features']) == 12, 'Expected twelve province boundaries'
          for file in ('index.html', 'instellingen/index.html', 'nederland/index.html', 'vo/index.html', 'vo/spel/index.html'):
              html = (root / file).read_text(encoding='utf-8')
              assert '<html' in html and '</html>' in html, file
              assert 'TOPO!' in html, file
          print('TOPO sources and 12 province boundaries OK')
          PY
      - name: Verify map, capitals, water sources and approved TOPO copy
        if: steps.deployment.outputs.id != ''
        run: node scripts/validate_topo_content.mjs
      - name: Verify the TOPO VO data bank in the release candidate
        if: steps.deployment.outputs.id != ''
        run: node scripts/validate_topo_vo_data.mjs candidate/topo/data/vo
      - name: Install FTPS client
        if: steps.deployment.outputs.id != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp openssl
      - name: Verify Theory7 FTPS certificate fingerprint
        if: steps.deployment.outputs.id != ''
        shell: bash
        run: |
          set -euo pipefail
          expected="4D:F5:15:4C:F3:11:5E:5B:DD:91:BD:5F:BD:0F:0E:A7:35:71:5C:32"
          actual="$(openssl s_client -starttls ftp -connect ftp.eaimodel.nl:21 -servername ftp.eaimodel.nl </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)"
          test "$actual" = "$expected" || { echo "Unexpected FTPS certificate fingerprint"; exit 1; }
      - name: Controleer main direct voor de eerste overdracht
        if: steps.deployment.outputs.id != ''
        env:
          TREE: ${{ steps.release.outputs.tree }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .commit.tree.sha)" = "$TREE"
      - name: Publish TOPO only (no deletion, no other site folders)
        if: steps.deployment.outputs.id != ''
        shell: bash
        env:
          HOST: ftp.eaimodel.nl
          FTP_USER: ${{ secrets.THEORY7_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.THEORY7_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD"
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$HOST:21" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:timeout 20
          set net:max-retries 1
          set xfer:use-temp-file yes
          set net:connection-limit 3
          mirror -R --parallel=2 --transfer-all --verbose candidate/topo/ /topo/
          bye
          EOF
      - name: Verify published PO and VO pages and data independently
        if: steps.deployment.outputs.id != ''
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          def fetch(relative):
              url = 'https://eaimodel.nl/topo/' + relative + '?release=' + os.environ['RELEASE_SHA'][:12]
              with urlopen(Request(url, headers={'User-Agent':'TOPO-release-check/1.0','Cache-Control':'no-cache'}), timeout=35) as reply:
                  assert reply.status == 200, (relative, reply.status)
                  return reply.read()

          root = Path('candidate/topo')
          for rel in ('index.html', 'instellingen/index.html', 'nederland/index.html', 'vo/index.html', 'vo/spel/index.html'):
              local = (root / rel).read_text(encoding='utf-8')
              remote = fetch(rel).decode('utf-8')
              # Cloudflare can add HTML tags; verify the full original application script instead.
              def app_script(html):
                  scripts = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', html, re.I | re.S)
                  assert scripts, 'No inline application script'
                  return max(scripts, key=len).strip()
              expected = hashlib.sha256(app_script(local).encode()).hexdigest()
              actual = hashlib.sha256(app_script(remote).encode()).hexdigest()
              assert actual == expected, f'Live TOPO {rel} differs from checked-out code'
              print('Published TOPO confirmed:', rel, actual[:12])

          local_map = (root / 'data/provincies-2026.geojson').read_bytes()
          remote_map = fetch('data/provincies-2026.geojson')
          assert hashlib.sha256(local_map).digest() == hashlib.sha256(remote_map).digest(), 'Live TOPO province data differs'
          assert len(json.loads(remote_map)['features']) == 12
          print('Published 2026 province boundaries confirmed')
          for rel in ('data/vo/sets.json', 'data/vo/doelen.json'):
              assert hashlib.sha256((root / rel).read_bytes()).digest() == hashlib.sha256(fetch(rel)).digest(), 'Live TOPO VO data differs: ' + rel
          print('Published TOPO VO sets and goals confirmed')
          PY

      - name: Registreer de uitkomst na de livecontroles
        if: always() && steps.deployment.outputs.id != ''
        env:
          ID: ${{ steps.deployment.outputs.id }}
          RESULT: ${{ job.status }}
        run: python scripts/release_deployment.py finish
