name: Check own exports
on:
  workflow_call:
    inputs:
      reuse_build:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  exports:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/checked-build
        with:
          reuse: ${{ inputs.reuse_build }}
      - name: Controleer de opgehaalde bouw
        run: |
          pip install beautifulsoup4
          python scripts/verify_ui.py --root site-build
      - name: Use the pinned browser runtime
        uses: ./.github/actions/browser-runtime
        with:
          binding: node
      - name: Test real PNG, PDF and text files
        run: |
          node scripts/check_own_exports.mjs
      - name: Verify signed and altered synthetic files
        run: node scripts/check_own_verifier.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-export-evidence-${{ github.run_attempt }}
          retention-days: 14
          path: own-export-results/
