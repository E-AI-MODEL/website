name: LO v13 - controle spelsimulatie
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      # Bestaande bestandslocaties ontbreken. De 64 modelproeven volgen hieronder.
      - name: Controleer rustige mobiele bediening
        run: python scripts/test_lo_calm_mobile.py
      - name: Bewaar mobiele proefbeelden
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sport-en-bewegen-mobile-check
          path: artifacts/lo-calm-mobile/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Controleer sporten, verdedigende tactiek en bewegingen
        shell: bash
        run: |
          python scripts/test_lo_v13_simulations.py
