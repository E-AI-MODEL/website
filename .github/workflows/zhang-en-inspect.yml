name: Inspect English Zhang review PDF
on:
  push:
    branches: [publish/zhang-english-final-2026]
    paths:
      - '.github/workflows/zhang-en-inspect.yml'
      - 'scripts/rebuild_zhang_review_en.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF library
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.7' 'Pillow==12.3.0'
      - name: Render inspection pages and report text positions
        run: |
          mkdir -p out
          cp assets/research/zhang-genai-l2-review-en-2026.pdf out/original-en.pdf
          python - <<'PY'
          import fitz
          d=fitz.open('out/original-en.pdf')
          print('PAGES',len(d),'LINKS',sum(len(p.get_links()) for p in d))
          for page_n in [1,3,6,9]:
              p=d[page_n-1]
              print('\nPAGE',page_n,'SIZE',p.rect)
              if page_n==1:
                  print('IMAGES:',[(x[0],x[2],x[3],p.get_image_rects(x[0])) for x in p.get_images(full=True)])
              for b in p.get_text('dict')['blocks']:
                  if 'lines' not in b:continue
                  for l in b['lines']:
                      txt=''.join(span['text'] for span in l['spans'])
                      if any(t in txt.lower() for t in ['alexa','heterogen','outcome concern','tool or design','fig. 3','figure 3','cohen', 'agreement','visser and chatgpt','disclosure','actively','different','benefit','research review','source research']):
                          print('LINE',list(round(v,1) for v in l['bbox']),repr(txt[:210]))
              page=p.get_pixmap(matrix=fitz.Matrix(1.6,1.6),alpha=False)
              page.save(f'out/english-page-{page_n}.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zhang-english-original-inspection
          path: out/*
          retention-days: 1
