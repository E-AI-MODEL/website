name: Verify public UI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install beautifulsoup4
      - run: python scripts/build_site.py --sources content/legacy --out site-build
      - run: python scripts/prepare_ui.py --root site-build
      - run: python scripts/verify_ui.py --root site-build
      - name: Verify LEIF is published without rewriting answers or access screen
        run: |
          test -s site-build/leif/index.html
          cmp leif/index.html site-build/leif/index.html
      - run: python -m unittest discover -s tests -p 'test_ui_release.py'
      - run: npm install --no-save playwright@1.56.1
      - name: Install browser for UI tests
        run: npx playwright install chromium
        timeout-minutes: 4
      - run: node scripts/ui_smoke.mjs site-build
      - name: Test Melkweg Lab on phones and desktop
        run: node scripts/test_melkweg_mobile.mjs site-build
      - name: Test direct visual experiments in Melkweg Lab
        run: node scripts/test_melkweg_visual_play.mjs site-build
      - name: Verify LEIF continuation in Chromium
        run: node scripts/test_leif_continue.mjs site-build
      - name: Verify LEIF text editor in Chromium
        if: ${{ !cancelled() }}
        run: node scripts/test_leif_site_editor.mjs site-build
      - name: Verify LEIF manager login and saved account in Chromium
        if: ${{ !cancelled() }}
        run: node scripts/test_leif_magic_login.mjs site-build
      - name: Verify compact LEIF Studio and per-participant edits in Chromium
        run: node scripts/test_leif_studio_ui.mjs site-build
      - name: Verify mobile LEIF question and exercise typing in Chromium
        run: node scripts/test_leif_mobile_questions.mjs site-build
      - name: Verify LEIF landing pages after participant login
        run: node scripts/test_leif_landing_ui.mjs site-build
      - name: Verify LEIF session API rejects unknown private codes
        run: |
          status="$(curl --silent --show-error --max-time 25 --output /tmp/leif-api-check.json --write-out '%{http_code}' --request POST 'https://ngcyfbstajfcfdhlelbz.supabase.co/functions/v1/leif-demo-session' --header 'Content-Type: application/json' --data '{"action":"load","token":"synthetic-invalid-continuation-code-xxxxxxxxxxxxxx"}')"
          test "$status" = "404" || { echo "LEIF API health check failed: HTTP $status"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-ui-check
          path: test-results/
