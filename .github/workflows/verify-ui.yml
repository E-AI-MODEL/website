name: Verify public UI
on:
  workflow_call:
    inputs:
      reuse_build:
        type: boolean
        default: false
      selection:
        type: string
        required: true
  workflow_dispatch:


permissions:
  contents: read
  actions: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: groups
        env:
          SELECTION: ${{ inputs.selection }}
        run: python3 scripts/ci_chromium.py
  applications:
    needs: browsers
    if: needs.browsers.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: ${{ fromJSON(needs.browsers.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/checked-build
        with:
          reuse: ${{ inputs.reuse_build }}
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-1.56.1-chromium
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - name: Test de geselecteerde toepassing
        env:
          GROUP: ${{ matrix.group }}
          EAIGAME_REQUIRE_3D: '1'
        run: python3 scripts/ci_chromium.py "$GROUP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-${{ matrix.group }}-${{ github.run_attempt }}
          path: test-results/
  verify:
    runs-on: ubuntu-24.04
    # De volledige selectie bevat beide WebGL-proeven op een software-renderer.
    # Houd ook bij een trage runner tijd over voor de overige browsercontroles.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install beautifulsoup4
      - uses: ./.github/actions/checked-build
        with:
          reuse: ${{ inputs.reuse_build }}
      - name: Verify one canonical hub per subject and legacy redirects
        run: python -m unittest discover -s tests -p 'test_hub_structure.py' -v
      - name: Check dashboard cards, route preservation and lab isolation
        run: python -m unittest discover -s tests -p 'test_dashboard_cards.py' -v
      - name: Verify editorial card scope and build output
        run: python -m unittest discover -s tests -p 'test_story_cards.py' -v
      - run: python scripts/verify_ui.py --root site-build
      - name: Test en controleer dubbele publicatiepagina's
        run: |
          python -m unittest discover -s tests -p 'test_publication_duplicates.py' -v
          mkdir -p test-results
          python scripts/check_publication_duplicates.py --root site-build --summary "$GITHUB_STEP_SUMMARY" --json test-results/publication-duplicates.json
      - name: Verify LEIF is published without rewriting answers or access screen
        run: |
          test -s site-build/leif/index.html
          cmp leif/index.html site-build/leif/index.html
      - run: python -m unittest discover -s tests -p 'test_ui_release.py'
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-1.56.1-chromium
      - run: npm install --no-save playwright@1.56.1
      - name: Install browser for UI tests
        run: npx playwright install chromium
        timeout-minutes: 4
      - run: python -m unittest discover -s tests -p test_tool_launch.py -v
      - run: node scripts/test_tool_launch.mjs site-build
      - run: node scripts/ui_smoke.mjs site-build
      - name: Verify LEIF session API rejects unknown private codes
        run: |
          status="$(curl --silent --show-error --max-time 25 --output /tmp/leif-api-check.json --write-out '%{http_code}' --request POST 'https://ngcyfbstajfcfdhlelbz.supabase.co/functions/v1/leif-demo-session' --header 'Content-Type: application/json' --data '{"action":"load","token":"synthetic-invalid-continuation-code-xxxxxxxxxxxxxx"}')"
          test "$status" = "404" || { echo "LEIF API health check failed: HTTP $status"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-ui-check-${{ github.run_attempt }}
          path: test-results/

      - name: Controleer dat de geteste bestanden ongewijzigd zijn
        run: python scripts/release_artifact.py verify --root site-build --manifest release-manifest.json --commit "$GITHUB_SHA"
