name: Verify public UI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/build_site.py --sources content/legacy --out site-build
      - run: python scripts/prepare_ui.py --root site-build
      - run: python scripts/verify_ui.py --root site-build
