name: Verify WiHTML editor and offline lesson

on:
  workflow_call:
    inputs:
      reuse_build:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wihtml:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install beautifulsoup4
      - uses: ./.github/actions/checked-build
        with:
          reuse: ${{ inputs.reuse_build }}
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Test lesson route, math plots, menus and offline export
        run: node scripts/test_wihtml_journey.mjs site-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wihtml-journey-check
          path: test-results/
