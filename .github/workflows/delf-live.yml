name: EAIspeak

on:
  pull_request:
    paths:
      - 'tools/delf-live/**'
      - '.github/workflows/delf-live.yml'
  push:
    branches:
      - main
      - feature/delf-live-stage-2026-11-19
    paths:
      - 'tools/delf-live/**'
      - '.github/workflows/delf-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bridge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/delf-live/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python audio bridge dependencies
        run: python -m pip install -r requirements.txt
      - name: Run audio, protocol and security tests
        run: |
          python -m compileall -q server.py tests
          python -m pytest -q tests

  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/delf-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controleer en bouw EAIspeak
        run: |
          npm install --no-audit --no-fund
          node --check src/main.js
          npm test
          npm run build
          test -s dist/index.html
          find dist/assets -name '*.js' -type f | grep -q .
      - name: Bewaar de geteste build
        uses: actions/upload-artifact@v4
        with:
          name: eaispeak-tested-build
          path: tools/delf-live/dist/
          if-no-files-found: error

  # Publication is intentionally separate: an owner-approved deployment must use the tested artifact.
