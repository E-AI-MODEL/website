name: Build EAI Site

on:
  push:
    branches:
      - site-migration
      - site-preview
      - ui-pdf-editorial
      - workforms-toolbox
      - workforms-professional-judgement
      - workforms-visual-support
      - site-v3-cohesion
      - site-welcome-landing
      - site-language-alignment
      - workforms-action-ux
      - workforms-concrete-actions
      - site-interface-v4
      - didactic-model-adapters-ui
      - workforms-toolbox-phase2
    paths:
      - '.github/workflows/scrape-google-site.yml'
      - 'scripts/build_site.py'
      - 'content/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eai-site-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          python -m playwright install chromium

      - name: Crawl published Google Site
        env:
          START_URL: https://sites.google.com/view/eaimodel/home
          SITE_PREFIX: https://sites.google.com/view/eaimodel
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, urldefrag

          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          START_URL = os.environ["START_URL"]
          SITE_PREFIX = os.environ["SITE_PREFIX"].rstrip("/")
          OUT = Path("scrape")
          OUT.mkdir(exist_ok=True)

          def normalize(url: str) -> str | None:
              if not url:
                  return None
              absolute = urljoin(START_URL, url)
              absolute, _ = urldefrag(absolute)
              parsed = urlparse(absolute)
              if parsed.scheme not in ("http", "https"):
                  return None
              if parsed.netloc != "sites.google.com":
                  return None
              if not parsed.path.startswith("/view/eaimodel"):
                  return None
              clean = f"{parsed.scheme}://{parsed.netloc}{parsed.path}"
              return clean.rstrip("/") or clean

          def slug_for(url: str) -> str:
              path = urlparse(url).path
              path = re.sub(r"^/view/eaimodel/?", "", path)
              path = path.strip("/") or "home"
              slug = re.sub(r"[^a-zA-Z0-9._-]+", "-", path).strip("-")
              return slug or "home"

          def clean_text(markup: str) -> str:
              soup = BeautifulSoup(markup, "html.parser")
              for tag in soup(["script", "style", "noscript"]):
                  tag.decompose()
              return "\n".join(
                  line.strip()
                  for line in soup.get_text("\n").splitlines()
                  if line.strip()
              )

          def extract_links(markup: str):
              soup = BeautifulSoup(markup, "html.parser")
              out = []
              for a in soup.find_all("a", href=True):
                  out.append({
                      "href": a.get("href", ""),
                      "text": " ".join(a.stripped_strings),
                  })
              return out

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page(viewport={"width": 1440, "height": 1100})
                  queue = [START_URL]
                  seen = set()
                  pages = []
                  max_pages = 160

                  while queue and len(seen) < max_pages:
                      url = normalize(queue.pop(0))
                      if not url or url in seen:
                          continue
                      seen.add(url)

                      try:
                          response = await page.goto(url, wait_until="domcontentloaded", timeout=45000)
                          await page.wait_for_timeout(1600)
                          status = response.status if response else None
                          title = await page.title()
                          body_text = await page.locator("body").inner_text()
                          html = await page.content()

                          links = await page.locator("a").evaluate_all(
                              """els => els.map(a => ({href: a.href, text: (a.innerText || a.textContent || '').trim()}))"""
                          )
                          images = await page.locator("img").evaluate_all(
                              """els => els.map(i => ({src: i.currentSrc || i.src, alt: i.alt || ''}))"""
                          )

                          internal = []
                          external = []

                          def register_link(href, text="", source="outer"):
                              n = normalize(href)
                              item = {"url": href, "text": text, "source": source}
                              if n:
                                  item["url"] = n
                                  internal.append(item)
                                  if n not in seen and n not in queue:
                                      queue.append(n)
                              elif href and href.startswith(("http://", "https://", "mailto:")):
                                  external.append(item)

                          for item in links:
                              register_link(item.get("href", ""), item.get("text", ""), "outer")

                          soup_full = BeautifulSoup(html, "html.parser")
                          embeds = []
                          slug = slug_for(url)

                          for idx, tag in enumerate(soup_full.find_all(attrs={"data-code": True}), start=1):
                              code = tag.get("data-code") or ""
                              if not code.strip():
                                  continue
                              embed_text = clean_text(code)
                              embed_links = extract_links(code)
                              for item in embed_links:
                                  register_link(item.get("href", ""), item.get("text", ""), f"embed-{idx}")

                              embed_html_name = f"{slug}-embed{idx}.html"
                              embed_txt_name = f"{slug}-embed{idx}.txt"
                              (OUT / embed_html_name).write_text(code, encoding="utf-8")
                              (OUT / embed_txt_name).write_text(embed_text, encoding="utf-8")
                              embeds.append({
                                  "index": idx,
                                  "html_file": embed_html_name,
                                  "text_file": embed_txt_name,
                                  "text": embed_text,
                                  "links": embed_links,
                              })

                          visible_text = clean_text(html)

                          record = {
                              "url": url,
                              "status": status,
                              "title": title,
                              "body_text": body_text,
                              "visible_text": visible_text,
                              "internal_links": internal,
                              "external_links": external,
                              "images": images,
                              "embeds": embeds,
                          }
                          pages.append(record)

                          (OUT / f"{slug}.html").write_text(html, encoding="utf-8")
                          (OUT / f"{slug}.txt").write_text(body_text, encoding="utf-8")

                          print(
                              f"SCRAPED {status} {url} :: {title} :: "
                              f"{len(body_text)} body chars :: {len(embeds)} embeds :: "
                              f"{len(internal)} internal links"
                          )
                      except Exception as exc:
                          pages.append({"url": url, "error": repr(exc)})
                          print(f"ERROR {url}: {exc!r}")

                  await browser.close()

              inventory = {
                  "start_url": START_URL,
                  "site_prefix": SITE_PREFIX,
                  "page_count": len(pages),
                  "pages": pages,
              }
              (OUT / "site_inventory.json").write_text(
                  json.dumps(inventory, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

              print(f"DONE: {len(pages)} pages captured")
              for rec in pages:
                  if "title" in rec:
                      print(
                          f"PAGE {rec['url']} | {rec['title']} | "
                          f"embeds={len(rec.get('embeds', []))}"
                      )

          asyncio.run(main())
          PY

      - name: Upload scrape artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-site-scrape
          path: scrape/
          if-no-files-found: error

      - name: Build new site
        run: |
          python scripts/build_site.py --scrape scrape --out site-build

      - name: Validate internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup

          root = Path("site-build")
          failures = []

          def target_for(href: str) -> Path | None:
              if not href.startswith("/") or href.startswith("//"):
                  return None
              path = urlsplit(href).path
              if path == "/":
                  return root / "index.html"
              rel = path.lstrip("/")
              candidate = root / rel
              if path.endswith("/"):
                  return candidate / "index.html"
              if candidate.is_file():
                  return candidate
              return candidate / "index.html"

          for page in root.rglob("*.html"):
              soup = BeautifulSoup(page.read_text(encoding="utf-8"), "html.parser")
              for a in soup.find_all("a", href=True):
                  href = a["href"].strip()
                  target = target_for(href)
                  if target is not None and not target.exists():
                      failures.append((str(page.relative_to(root)), href))

          if failures:
              print("Broken internal links:")
              for page, href in failures:
                  print(f"  {page}: {href}")
              raise SystemExit(1)

          print("Internal link check passed")
          PY

      - name: Rewrite preview URLs for static branch preview
        if: github.ref == 'refs/heads/site-preview'
        env:
          PREVIEW_BASE: https://raw.githack.com/E-AI-MODEL/website/site-preview
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from bs4 import BeautifulSoup

          root = Path("site-build")
          base = os.environ["PREVIEW_BASE"].rstrip("/")

          for page in root.rglob("*.html"):
              soup = BeautifulSoup(page.read_text(encoding="utf-8"), "html.parser")

              for tag, attr in (("a", "href"), ("link", "href"), ("img", "src"), ("script", "src")):
                  for node in soup.find_all(tag):
                      value = node.get(attr)
                      if not value or not value.startswith("/") or value.startswith("//"):
                          continue
                      if value == "/":
                          node[attr] = f"{base}/index.html"
                      elif value.endswith("/"):
                          node[attr] = f"{base}{value}index.html"
                      else:
                          node[attr] = f"{base}{value}"

              page.write_text(str(soup), encoding="utf-8")

          print(f"Preview URLs rewritten to {base}")
          PY

      - name: Publish generated files to migration branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          REMOTE_SHA="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
            echo "A newer commit exists on $GITHUB_REF_NAME; this run is stale and will not publish generated files."
            exit 0
          fi

          rm -rf assets publicaties tools eai-blog eai-tools-modules eaa-model onderwijsin twee-pijlers workshop-ai werkvormen onderbouwing praktijk over verdieping
          cp -R site-build/assets .
          cp -R site-build/publicaties .
          cp -R site-build/tools .
          cp -R site-build/eai-blog .
          cp -R site-build/eai-tools-modules .
          cp -R site-build/eaa-model .
          cp -R site-build/onderwijsin .
          cp -R site-build/twee-pijlers .
          cp -R site-build/workshop-ai .
          cp -R site-build/werkvormen .
          cp -R site-build/onderbouwing .
          cp -R site-build/praktijk .
          cp -R site-build/over .
          cp -R site-build/verdieping .
          cp site-build/index.html site-build/404.html site-build/robots.txt site-build/sitemap.xml .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html robots.txt sitemap.xml assets publicaties tools eai-blog eai-tools-modules eaa-model onderwijsin twee-pijlers workshop-ai werkvormen onderbouwing praktijk over verdieping
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh EAI site"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
