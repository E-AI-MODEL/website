name: Scrape Google Site

on:
  push:
    branches:
      - site-migration
    paths:
      - '.github/workflows/scrape-google-site.yml'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          python -m playwright install chromium

      - name: Crawl published Google Site
        env:
          START_URL: https://sites.google.com/view/eaimodel/home
          SITE_PREFIX: https://sites.google.com/view/eaimodel
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, urldefrag

          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          START_URL = os.environ["START_URL"]
          SITE_PREFIX = os.environ["SITE_PREFIX"].rstrip("/")
          OUT = Path("scrape")
          OUT.mkdir(exist_ok=True)

          def normalize(url: str) -> str | None:
              if not url:
                  return None
              absolute = urljoin(START_URL, url)
              absolute, _ = urldefrag(absolute)
              parsed = urlparse(absolute)
              if parsed.scheme not in ("http", "https"):
                  return None
              if parsed.netloc != "sites.google.com":
                  return None
              if not parsed.path.startswith("/view/eaimodel"):
                  return None
              clean = f"{parsed.scheme}://{parsed.netloc}{parsed.path}"
              return clean.rstrip("/") or clean

          def slug_for(url: str) -> str:
              path = urlparse(url).path
              path = re.sub(r"^/view/eaimodel/?", "", path)
              path = path.strip("/") or "home"
              slug = re.sub(r"[^a-zA-Z0-9._-]+", "-", path).strip("-")
              return slug or "home"

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page(viewport={"width": 1440, "height": 1100})
                  queue = [START_URL]
                  seen = set()
                  pages = []
                  max_pages = 120

                  while queue and len(seen) < max_pages:
                      url = normalize(queue.pop(0))
                      if not url or url in seen:
                          continue
                      seen.add(url)

                      try:
                          response = await page.goto(url, wait_until="domcontentloaded", timeout=45000)
                          await page.wait_for_timeout(1800)
                          status = response.status if response else None
                          title = await page.title()
                          body_text = await page.locator("body").inner_text()
                          html = await page.content()

                          links = await page.locator("a").evaluate_all(
                              """els => els.map(a => ({href: a.href, text: (a.innerText || a.textContent || '').trim()}))"""
                          )
                          images = await page.locator("img").evaluate_all(
                              """els => els.map(i => ({src: i.currentSrc || i.src, alt: i.alt || ''}))"""
                          )

                          internal = []
                          for item in links:
                              n = normalize(item.get("href"))
                              if n:
                                  internal.append({"url": n, "text": item.get("text", "")})
                                  if n not in seen and n not in queue:
                                      queue.append(n)

                          soup = BeautifulSoup(html, "html.parser")
                          for tag in soup(["script", "style", "noscript"]):
                              tag.decompose()
                          visible_text = "\n".join(
                              line.strip()
                              for line in soup.get_text("\n").splitlines()
                              if line.strip()
                          )

                          record = {
                              "url": url,
                              "status": status,
                              "title": title,
                              "body_text": body_text,
                              "visible_text": visible_text,
                              "internal_links": internal,
                              "images": images,
                          }
                          pages.append(record)

                          slug = slug_for(url)
                          (OUT / f"{slug}.html").write_text(html, encoding="utf-8")
                          (OUT / f"{slug}.txt").write_text(body_text, encoding="utf-8")

                          print(f"SCRAPED {status} {url} :: {title} :: {len(body_text)} chars :: {len(internal)} internal links")
                      except Exception as exc:
                          pages.append({"url": url, "error": repr(exc)})
                          print(f"ERROR {url}: {exc!r}")

                  await browser.close()

              (OUT / "site_inventory.json").write_text(
                  json.dumps(
                      {
                          "start_url": START_URL,
                          "site_prefix": SITE_PREFIX,
                          "page_count": len(pages),
                          "pages": pages,
                      },
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

              print(f"DONE: {len(pages)} pages captured")
              for rec in pages:
                  if "title" in rec:
                      print(f"PAGE {rec['url']} | {rec['title']}")

          asyncio.run(main())
          PY

      - name: Upload scrape artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-site-scrape
          path: scrape/
          if-no-files-found: error
