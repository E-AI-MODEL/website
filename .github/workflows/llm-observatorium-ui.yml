name: Test Hoe werkt een AI
on:
  pull_request:
    branches: [main]
    paths:
      - 'content/llm-observatorium/**'
      - 'scripts/test_llm_observatorium.mjs'
      - 'scripts/test_llm_learning_math.mjs'
      - 'assets/llm-learning-math.js'
      - 'assets/llm-real-trace.json'
      - 'assets/llm-real-trace-viewer.js'
      - 'scripts/test_llm_real_trace.py'
      - 'tools/llm-observatorium/**'
      - 'scripts/test_llm_mobile_webkit.mjs'
      - 'tests/test_llm_observatorium_source.py'
      - '.github/workflows/llm-observatorium-ui.yml'
  push:
    branches: [main]
    paths:
      - 'content/llm-observatorium/**'
      - 'scripts/test_llm_observatorium.mjs'
      - 'scripts/test_llm_learning_math.mjs'
      - 'assets/llm-learning-math.js'
      - 'assets/llm-real-trace.json'
      - 'assets/llm-real-trace-viewer.js'
      - 'scripts/test_llm_real_trace.py'
      - 'tools/llm-observatorium/**'
      - 'scripts/test_llm_mobile_webkit.mjs'
      - 'tests/test_llm_observatorium_source.py'
      - '.github/workflows/llm-observatorium-ui.yml'
permissions:
  contents: read
jobs:
  llm-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install beautifulsoup4
      - name: Build LLM page from source
        run: python scripts/build_site.py --sources content/legacy --out site-build
      - run: python scripts/prepare_ui.py --root site-build
      - name: Verify local learning mathematics
        run: node scripts/test_llm_learning_math.mjs
      - name: Verify real recorded GPT-Neo model execution
        run: python scripts/test_llm_real_trace.py assets/llm-real-trace.json
      - name: Validate original model and updated visualization
        run: python -m unittest discover -s tests -p 'test_llm_observatorium_source.py' -v
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Nine learning steps, research views and token interaction
        run: node scripts/test_llm_observatorium.mjs site-build
      - name: Install WebKit for Safari layout checks
        run: npx playwright install --with-deps webkit
      - name: Verify mobile Safari-style layouts
        run: node scripts/test_llm_mobile_webkit.mjs site-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-observatorium-mobile-desktop
          path: test-results/llm-*.png
