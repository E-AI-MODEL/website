name: Check website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check navigation and page structure
        run: node scripts/check-site.mjs
      - name: Check Science Observatory and observatory navigation
        run: node --test tests/test_science_observatory_navigation.mjs
      - name: Test physics reference cases
        run: node --test tests/test_science_physics_models.mjs
      - name: Check physics reference values and drawings
        run: node --test tests/test_science_physics_models.mjs
      - name: Check wave motion and optical models
        run: node --test tests/test_science_physics_round3.mjs
      - name: Check physical graph axes and comparisons
        run: node --test tests/test_science_physical_graphs.mjs
      - name: Check animation, graph and measurement agreement
        run: node --test tests/test_science_graph_animation_alignment.mjs
      - name: Verify one KEI login opens the complete LEIF website
        run: node --test tests/test_leif_kei.mjs
      - name: Verify LEIF reader and corrected text
        run: node --test tests/test_leif_ereader.mjs tests/test_leif_question_copy_mobile.mjs
      - name: Check separate LEIF dossiers, admin rights and codes
        run: node --test tests/test_leif_multitenant.mjs tests/test_leif_account.mjs tests/test_leif_admin_session.mjs tests/test_leif_studio.mjs
