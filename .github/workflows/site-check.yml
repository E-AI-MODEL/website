name: Check website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Kies controles voor gewijzigde onderdelen
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || ! git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            python3 scripts/ci_pr_scope.py --all --output "$GITHUB_OUTPUT"
          else
            mapfile -d '' changed < <(git diff --name-only -z HEAD^1 HEAD)
            python3 scripts/ci_pr_scope.py --output "$GITHUB_OUTPUT" "${changed[@]}"
          fi
      - name: Controleer de afbakening van de tests
        run: python3 -m unittest discover -s tests -p 'test_ci_pr_scope.py' -v
      - name: Check EAIgit ZIP and GitHub journey
        if: ${{ steps.scope.outputs.eaigit == 'true' }}
        run: node --test tests/test_projecthulp.mjs tests/test_eaigit_help.mjs tests/test_eaigit_single_file.mjs
      - name: Check navigation and page structure
        run: node scripts/check-site.mjs
      - name: Controleer scheiding tussen website- en TOPO-publicatie
        if: ${{ steps.scope.outputs.publishing == 'true' }}
        run: python3 -m unittest discover -s tests -p 'test_publication_ownership.py' -v
      - name: Check Science Observatory and observatory navigation
        if: ${{ steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_observatory_navigation.mjs
      - name: Check physics reference values and drawings
        if: ${{ steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physics_models.mjs
      - name: Check wave motion and optical models
        if: ${{ steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physics_round3.mjs
      - name: Check 53 proefspecifieke natuurkundeberekeningen
        if: ${{ steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physics_insights.mjs
      - name: Check physics source references and independent calculations
        if: ${{ steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physics_evidence.mjs
      - name: Check independent model references for the other 48 physics labs
        if: ${{ steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physics_reference_48.mjs
      - name: Check physics visuals against the simulated equations
        if: ${{ steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physics_visual_fidelity.mjs
      - name: Check physical graph axes and comparisons
        if: ${{ steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physical_graphs.mjs
      - name: Check animation, graph and measurement agreement
        if: ${{ steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_graph_animation_alignment.mjs
      - name: Check three learning routes and the projectile target
        if: ${{ steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_inquiry_variants.mjs
      - name: Verify one KEI login opens the complete LEIF website
        if: ${{ steps.scope.outputs.leif == 'true' }}
        run: node --test tests/test_leif_kei.mjs
      - name: Verify LEIF reader and corrected text
        if: ${{ steps.scope.outputs.leif == 'true' }}
        run: node --test tests/test_leif_ereader.mjs tests/test_leif_question_copy_mobile.mjs
      - name: Check separate LEIF dossiers, admin rights and codes
        if: ${{ steps.scope.outputs.leif == 'true' }}
        run: node --test tests/test_leif_multitenant.mjs tests/test_leif_account.mjs tests/test_leif_admin_session.mjs tests/test_leif_studio.mjs
