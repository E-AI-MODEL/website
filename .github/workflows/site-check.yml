name: Check website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check EAIwork dashboard preview contract
        run: python3 -m unittest discover -s tests -p 'test_eaiwork_publish.py' -v
      - name: Check navigation and page structure
        run: node scripts/check-site.mjs
      - name: Verify one KEI login opens the complete LEIF website
        run: node --test tests/test_leif_kei.mjs
      - name: Verify LEIF reader and corrected text
        run: node --test tests/test_leif_ereader.mjs tests/test_leif_question_copy_mobile.mjs
      - name: Check separate LEIF dossiers, admin rights and codes
        run: node --test tests/test_leif_multitenant.mjs tests/test_leif_account.mjs tests/test_leif_admin_session.mjs tests/test_leif_studio.mjs
