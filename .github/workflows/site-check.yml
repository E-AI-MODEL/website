name: Check website

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release_artifact:
        type: boolean
        default: false
      skip_topo:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      ictscan: ${{ steps.scope.outputs.ictscan }}
      topo: ${{ steps.scope.outputs.topo }}
      anatomy: ${{ steps.scope.outputs.anatomy }}
      eaigit: ${{ steps.scope.outputs.eaigit }}
      eaispeak: ${{ steps.scope.outputs.eaispeak }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bepaal welke toepassingen geraakt zijn
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || ! git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            python3 scripts/ci_pr_scope.py --all --output "$GITHUB_OUTPUT"
          else
            git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
            mapfile -d '' changed < "$RUNNER_TEMP/changed-files"
            python3 scripts/ci_pr_scope.py --output "$GITHUB_OUTPUT" "${changed[@]}"
          fi
  build-check:
    uses: ./.github/workflows/build-site.yml
  eaispeak-check:
    needs: scope
    if: ${{ needs.scope.outputs.eaispeak == 'true' }}
    uses: ./.github/workflows/eaispeak.yml
  ui-check:
    needs: [scope, eaispeak-check]
    if: ${{ always() && needs.scope.result == 'success' && (needs.eaispeak-check.result == 'success' || needs.eaispeak-check.result == 'skipped') }}
    uses: ./.github/workflows/verify-ui.yml
    with:
      release_artifact: ${{ inputs.release_artifact == true }}
      eaispeak_artifact: ${{ needs.eaispeak-check.result == 'success' }}
  register-check:
    uses: ./.github/workflows/check-website-register.yml
  ict-check:
    needs: scope
    if: ${{ needs.scope.outputs.ictscan == 'true' }}
    uses: ./.github/workflows/check-ict-assurance.yml
  ict-webkit:
    needs: scope
    if: ${{ needs.scope.outputs.ictscan == 'true' }}
    uses: ./.github/workflows/ict-scan-webkit.yml
  topo-check:
    needs: scope
    if: ${{ needs.scope.outputs.topo == 'true' && inputs.skip_topo != true }}
    uses: ./.github/workflows/topo-mobile-verify.yml
  anatomy-webkit:
    needs: scope
    if: ${{ needs.scope.outputs.anatomy == 'true' }}
    uses: ./.github/workflows/anatomie-webkit.yml
  eaigit-check:
    needs: scope
    if: ${{ needs.scope.outputs.eaigit == 'true' }}
    uses: ./.github/workflows/projecthulp-browser.yml
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check EAIgit ZIP and GitHub journey
        run: node --test tests/test_projecthulp.mjs tests/test_eaigit_help.mjs tests/test_eaigit_single_file.mjs
      - name: Check navigation and page structure
        run: node scripts/check-site.mjs
      - name: Controleer scheiding tussen website- en TOPO-publicatie
        run: python3 -m unittest discover -s tests -p 'test_publication_ownership.py' -v
      - name: Check Science Observatory and observatory navigation
        run: node --test tests/test_science_observatory_navigation.mjs
      - name: Check physics reference values and drawings
        run: node --test tests/test_science_physics_models.mjs
      - name: Check wave motion and optical models
        run: node --test tests/test_science_physics_round3.mjs
      - name: Check 53 proefspecifieke natuurkundeberekeningen
        run: node --test tests/test_science_physics_insights.mjs
      - name: Check physics source references and independent calculations
        run: node --test tests/test_science_physics_evidence.mjs
      - name: Check independent model references for the other 48 physics labs
        run: node --test tests/test_science_physics_reference_48.mjs
      - name: Check physics visuals against the simulated equations
        run: node --test tests/test_science_physics_visual_fidelity.mjs
      - name: Check physical graph axes and comparisons
        run: node --test tests/test_science_physical_graphs.mjs
      - name: Check animation, graph and measurement agreement
        run: node --test tests/test_science_graph_animation_alignment.mjs
      - name: Check three learning routes and the projectile target
        run: node --test tests/test_science_inquiry_variants.mjs
      - name: Verify one KEI login opens the complete LEIF website
        run: node --test tests/test_leif_kei.mjs
      - name: Verify LEIF reader and corrected text
        run: node --test tests/test_leif_ereader.mjs tests/test_leif_question_copy_mobile.mjs
      - name: Check separate LEIF dossiers, admin rights and codes
        run: node --test tests/test_leif_multitenant.mjs tests/test_leif_account.mjs tests/test_leif_admin_session.mjs tests/test_leif_studio.mjs
      - name: Controleer EAIspeak-publicatiegrenzen
        run: python3 -m unittest discover -s tests -p 'test_eaispeak_publish.py' -v
      - name: Controleer selectie en blokkering van publicaties
        run: |
          python3 -m unittest discover -s tests -p 'test_ci_pr_scope.py' -v
          python3 -m unittest discover -s tests -p 'test_release_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_release_artifact.py' -v

  # De bestaande actieve branchregel vereist deze naam. Behoud deze context.
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    needs: [scope, source-checks, build-check, ui-check, register-check, ict-check, ict-webkit, topo-check, anatomy-webkit, eaigit-check, eaispeak-check]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: Controleer alle verplichte resultaten
        env:
          RELEASE_RESULTS: ${{ toJSON(needs) }}
          SKIP_TOPO: ${{ inputs.skip_topo == true }}
        run: python3 scripts/check_release_gate.py
