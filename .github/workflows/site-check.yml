name: Check website

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip_topo:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Only obsolete PR runs are cancelled. Main validation and deployments are independent.
concurrency:
  group: site-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.scope.outputs.selection }}
      jobs: ${{ steps.scope.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Selecteer vanaf de laatst geslaagde websitepublicatie
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=""
          args=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == push ]]; then
            delivery=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=theory7-site&per_page=1" --jq '.[0].id // empty') || delivery=""
            if [[ -n "$delivery" ]]; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$delivery/statuses?per_page=1" --jq '.[0].state') || status=""
              if [[ "$status" == success ]]; then
                published=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$delivery" --jq .sha) || published=""
              fi
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then args+=(--include-topo); fi
          python3 scripts/ci_pr_scope.py --published "$published" --output "$GITHUB_OUTPUT" "${args[@]}"

  eaispeak-check:
    needs: scope
    uses: ./.github/workflows/eaispeak.yml
  build-check:
    needs: [scope, eaispeak-check]
    with:
      selection: ${{ needs.scope.outputs.selection }}
      eaispeak_artifact: true
      central_validation: true
    uses: ./.github/workflows/build-site.yml
  ui-check:
    needs: [scope, build-check]
    uses: ./.github/workflows/verify-ui.yml
    with:
      reuse_build: true
      selection: ${{ needs.scope.outputs.selection }}
  register-check:
    uses: ./.github/workflows/check-website-register.yml
  ict-check:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.jobs)['ict-check'] }}
    uses: ./.github/workflows/check-ict-assurance.yml
  ict-webkit:
    needs: [scope, build-check]
    if: ${{ fromJSON(needs.scope.outputs.jobs)['ict-webkit'] }}
    uses: ./.github/workflows/ict-scan-webkit.yml
    with:
      reuse_build: true
  topo-check:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.jobs)['topo-check'] && inputs.skip_topo != true }}
    uses: ./.github/workflows/topo-mobile-verify.yml
  anatomy-webkit:
    needs: [scope, build-check]
    if: ${{ fromJSON(needs.scope.outputs.jobs)['anatomy-webkit'] }}
    uses: ./.github/workflows/anatomie-webkit.yml
    with:
      reuse_build: true
  eaigit-check:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.jobs)['eaigit-check'] }}
    uses: ./.github/workflows/projecthulp-browser.yml
  audit-archive:
    needs: [scope, build-check]
    if: ${{ fromJSON(needs.scope.outputs.jobs)['audit-archive'] }}
    uses: ./.github/workflows/audit-archive.yml
    with:
      reuse_build: true
  check-own-exports:
    needs: [scope, build-check]
    if: ${{ fromJSON(needs.scope.outputs.jobs)['check-own-exports'] }}
    uses: ./.github/workflows/check-own-exports.yml
    with:
      reuse_build: true
  projecthulp-eaiwork-proof:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.jobs)['projecthulp-eaiwork-proof'] }}
    uses: ./.github/workflows/projecthulp-eaiwork-proof.yml
  eaigame:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.jobs)['eaigame'] }}
    uses: ./.github/workflows/eaigame.yml
  leeuw-console:
    needs: [scope, build-check]
    if: ${{ fromJSON(needs.scope.outputs.jobs)['leeuw-console'] }}
    uses: ./.github/workflows/leeuw-console.yml
    with:
      reuse_build: true
  science-fixed-workspace:
    needs: [scope, build-check]
    if: ${{ fromJSON(needs.scope.outputs.jobs)['science-fixed-workspace'] }}
    uses: ./.github/workflows/science-fixed-workspace.yml
    with:
      reuse_build: true
      skip_duplicate_chromium: true
  science-studio-webkit:
    needs: [scope, build-check]
    if: ${{ fromJSON(needs.scope.outputs.jobs)['science-studio-webkit'] }}
    uses: ./.github/workflows/science-studio-webkit.yml
    with:
      reuse_build: true
  llm-observatorium-ui:
    needs: [scope, build-check]
    if: ${{ fromJSON(needs.scope.outputs.jobs)['llm-observatorium-ui'] }}
    uses: ./.github/workflows/llm-observatorium-ui.yml
    with:
      reuse_build: true
      skip_duplicate_chromium: true
  check-llmscan:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.jobs)['check-llmscan'] }}
    uses: ./.github/workflows/check-llmscan.yml
  lo-aanvalslab:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.jobs)['lo-aanvalslab'] }}
    uses: ./.github/workflows/lo-aanvalslab.yml
  lo-tactics-source:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.jobs)['lo-tactics-source'] }}
    uses: ./.github/workflows/lo-tactics-source.yml
  onderwijsregio-ui:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.jobs)['onderwijsregio-ui'] }}
    uses: ./.github/workflows/onderwijsregio-ui.yml
  verify-wihtml:
    needs: [scope, build-check]
    if: ${{ fromJSON(needs.scope.outputs.jobs)['verify-wihtml'] }}
    uses: ./.github/workflows/verify-wihtml.yml
    with:
      reuse_build: true
  test-html-gallery-auth:
    needs: scope
    uses: ./.github/workflows/test-html-gallery-auth.yml
  astronomy-validation:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.jobs)['astronomy-validation'] }}
    uses: ./.github/workflows/astronomy-validation.yml
  source-checks:
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check EAIgit ZIP and GitHub journey
        if: ${{ fromJSON(needs.scope.outputs.selection).eaigit == 'true' }}
        run: node --test tests/test_projecthulp.mjs tests/test_eaigit_help.mjs tests/test_eaigit_single_file.mjs
      - name: Controleer bewerkrechten en bronintegriteit van de ICT-scan
        run: |
          php tests/test_ict_scan_edit_api.php
          node --test tests/test_ict_scan_assurance_security.mjs
      - name: Check navigation and page structure
        run: node scripts/check-site.mjs
      - name: Controleer scheiding tussen website- en TOPO-publicatie
        run: python3 -m unittest discover -s tests -p 'test_publication_ownership.py' -v
      - name: Check Science Observatory and observatory navigation
        run: node --test tests/test_science_observatory_navigation.mjs
      - name: Check physics reference values and drawings
        if: ${{ fromJSON(needs.scope.outputs.selection).physics == 'true' }}
        run: node --test tests/test_science_physics_models.mjs
      - name: Check wave motion and optical models
        if: ${{ fromJSON(needs.scope.outputs.selection).physics == 'true' }}
        run: node --test tests/test_science_physics_round3.mjs
      - name: Check 53 proefspecifieke natuurkundeberekeningen
        if: ${{ fromJSON(needs.scope.outputs.selection).physics == 'true' }}
        run: node --test tests/test_science_physics_insights.mjs
      - name: Check physics source references and independent calculations
        if: ${{ fromJSON(needs.scope.outputs.selection).physics == 'true' }}
        run: node --test tests/test_science_physics_evidence.mjs
      - name: Check independent model references for the other 48 physics labs
        if: ${{ fromJSON(needs.scope.outputs.selection).physics == 'true' }}
        run: node --test tests/test_science_physics_reference_48.mjs
      - name: Check physics visuals against the simulated equations
        if: ${{ fromJSON(needs.scope.outputs.selection).physics == 'true' }}
        run: node --test tests/test_science_physics_visual_fidelity.mjs
      - name: Check physical graph axes and comparisons
        if: ${{ fromJSON(needs.scope.outputs.selection).physics == 'true' }}
        run: node --test tests/test_science_physical_graphs.mjs
      - name: Check animation, graph and measurement agreement
        if: ${{ fromJSON(needs.scope.outputs.selection).physics == 'true' }}
        run: node --test tests/test_science_graph_animation_alignment.mjs
      - name: Check three learning routes and the projectile target
        if: ${{ fromJSON(needs.scope.outputs.selection).physics == 'true' }}
        run: node --test tests/test_science_inquiry_variants.mjs
      - name: Verify one KEI login opens the complete LEIF website
        run: node --test tests/test_leif_kei.mjs
      - name: Verify LEIF reader and corrected text
        if: ${{ fromJSON(needs.scope.outputs.selection).leif == 'true' }}
        run: node --test tests/test_leif_ereader.mjs tests/test_leif_question_copy_mobile.mjs
      - name: Check separate LEIF dossiers, admin rights and codes
        run: node --test tests/test_leif_multitenant.mjs tests/test_leif_account.mjs tests/test_leif_admin_session.mjs tests/test_leif_studio.mjs
      - name: Controleer selectie en blokkering van publicaties
        run: |
          python3 -m unittest discover -s tests -p 'test_ci_pr_scope.py' -v
          python3 -m unittest discover -s tests -p 'test_release_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_release_artifact.py' -v
          python3 -m unittest discover -s tests -p 'test_ci_scenarios.py' -v

  # De bestaande actieve branchregel vereist deze naam. Behoud deze context.
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    needs: [scope, source-checks, build-check, ui-check, register-check, eaispeak-check, ict-check, ict-webkit, topo-check, anatomy-webkit, eaigit-check, audit-archive, check-own-exports, projecthulp-eaiwork-proof, eaigame, leeuw-console, science-fixed-workspace, science-studio-webkit, llm-observatorium-ui, check-llmscan, lo-aanvalslab, lo-tactics-source, onderwijsregio-ui, verify-wihtml, test-html-gallery-auth, astronomy-validation]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: Controleer alle verplichte resultaten
        env:
          RELEASE_RESULTS: ${{ toJSON(needs) }}
          SKIP_TOPO: ${{ inputs.skip_topo == true }}
        run: |
          python3 scripts/check_release_gate.py
          printf '%s\n' "$RELEASE_RESULTS" > test-uitslagen.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-uitslagen-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-uitslagen.json
          if-no-files-found: error
