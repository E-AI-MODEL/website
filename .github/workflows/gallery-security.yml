name: HTML gallery authentication
on:
  pull_request:
    paths:
      - 'services/html-galerij/**'
      - 'tools/html-galerij/index.html'
      - 'tests/test_html_galerij_admin.mjs'
      - 'tests/test_html_galerij_publish.py'
      - '.github/workflows/gallery-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test gallery login, sessions, API rights and logout
        run: node tests/test_html_galerij_admin.mjs
      - name: Check Worker module and scripts for syntax errors
        run: |
          node --check services/html-galerij/src/auth.js
          node --check services/html-galerij/src/ui.js
          node --check services/html-galerij/src/index.js
          node --check services/html-galerij/scripts/password-hash.mjs
