name: LO Analyse Easter egg - browsertest
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/lo-aanvalslab/index.html'
      - 'scripts/test_lo_easteregg.py'
      - '.github/workflows/lo-easteregg-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test spelberekeningen, desktop, mobiel en verborgen analyse
        run: python scripts/test_lo_easteregg.py
