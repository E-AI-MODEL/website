name: LO Analyse Easter egg - browsertest
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/lo-aanvalslab/index.html'
      - 'tools/lo-aanvalslab/onderbouwing/index.html'
      - 'tests/test_lo_evidence_publish.py'
      - 'scripts/test_lo_easteregg.py'
      - 'scripts/benchmark_lo_defence.py'
      - '.github/workflows/lo-easteregg-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test zichtbaarheid, bronpagina en publicatie
        run: python -m unittest discover -s tests -p 'test_lo_evidence_publish.py' -v
      - name: Test spelberekeningen, desktop, mobiel en verborgen analyse
        run: python scripts/test_lo_easteregg.py
      - name: Vergelijk verdediging en rolbezetting bij 128 situaties
        run: python scripts/benchmark_lo_defence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defence-benchmark-${{ github.sha }}
          path: defence_benchmark_results.json
          if-no-files-found: ignore
