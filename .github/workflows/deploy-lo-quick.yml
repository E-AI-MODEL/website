name: Publiceer alleen LO Aanvalslab

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read


jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Controleer de bron van de online duofunctie
        run: |
          test -s tools/lo-aanvalslab/index.html
          test -s tools/lo-aanvalslab/onderbouwing/index.html
          grep -q 'Wetenschappelijke onderbouwing' tools/lo-aanvalslab/index.html
          grep -q 'startRealtime' tools/lo-aanvalslab/index.html
          grep -q 'onlineChoice' tools/lo-aanvalslab/index.html

      - name: Leg de vooraf gecontroleerde overdrachtsbestanden vast
        run: python3 scripts/recovery_files.py create tools/lo-aanvalslab/index.html tools/lo-aanvalslab/onderbouwing/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-files/
            recovery-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: prepare
    environment: theory7-herstel
    concurrency:
      group: theory7-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Controleer de goedkeuring van de eigenaar
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e --arg id "$OWNER_ID" 'any(.[]; .state == "approved" and (.user.id|tostring) == $id and any(.environments[]; .name == "theory7-herstel"))'
      - uses: actions/download-artifact@v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
      - run: python3 scripts/recovery_files.py verify
      - run: cp -a recovery-files/. .
      - name: Installeer FTPS-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp openssl

      - name: Controleer het FTPS-certificaat
        env:
          HOST: ftp.eaimodel.nl
        shell: bash
        run: |
          set -euo pipefail
          expected="4D:F5:15:4C:F3:11:5E:5B:DD:91:BD:5F:BD:0F:0E:A7:35:71:5C:32"
          actual="$(openssl s_client -starttls ftp -connect "$HOST:21" -servername "$HOST" </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)"
          test "$actual" = "$expected"

      - name: Publiceer alleen het LO Aanvalslab
        env:
          HOST: ftp.eaimodel.nl
          FTP_USER: ${{ secrets.THEORY7_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.THEORY7_FTP_PASSWORD }}
        shell: bash
        working-directory: recovery-files
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$HOST:21" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:timeout 20
          set net:max-retries 1
          set xfer:use-temp-file yes
          mkdir -p /tools/lo-aanvalslab
          mkdir -p /tools/lo-aanvalslab/onderbouwing
          put tools/lo-aanvalslab/index.html -o /tools/lo-aanvalslab/index.html
          put tools/lo-aanvalslab/onderbouwing/index.html -o /tools/lo-aanvalslab/onderbouwing/index.html
          bye
          EOF

      - name: Controleer exacte live HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import time,hashlib
          source=Path('tools/lo-aanvalslab/index.html').read_bytes()
          expected=hashlib.sha256(source).hexdigest()
          url='https://eaimodel.nl/tools/lo-aanvalslab/'
          page=Path('tools/lo-aanvalslab/onderbouwing/index.html').read_bytes()
          expected_page=hashlib.sha256(page).hexdigest()
          for attempt in range(8):
              try:
                  remote=urlopen(url+'?lo='+str(time.time()),timeout=20).read()
                  live_page=urlopen(url+'onderbouwing/?lo='+str(time.time()),timeout=20).read()
                  if hashlib.sha256(remote).hexdigest()==expected and hashlib.sha256(live_page).hexdigest()==expected_page:
                      print('LO Aanvalslab en onderbouwing live, exacte bronnen bevestigd')
                      break
                  print('Andere inhoud ontvangen; opnieuw controleren')
              except Exception as error:
                  print('Nog niet bereikbaar:',error)
              time.sleep(6)
          else:
              raise SystemExit('Live Aanvalslab of onderbouwing wijkt af van actuele bron')
          PY
