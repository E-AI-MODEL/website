name: Test compacte schuine worp in Safari
on:
  pull_request:
    branches: [main]
    paths:
      - 'content/science-observatory/labs/schuine-worp.html'
      - 'content/science-observatory/labs/natuurkunde.html'
      - 'scripts/test_schuine_worp_studio.mjs'
      - 'scripts/build_site.py'
      - '.github/workflows/science-studio-webkit.yml'
  push:
    branches: [main]
    paths:
      - 'content/science-observatory/labs/schuine-worp.html'
      - 'scripts/test_schuine_worp_studio.mjs'
      - '.github/workflows/science-studio-webkit.yml'
permissions:
  contents: read
jobs:
  studio-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install beautifulsoup4
      - run: python scripts/build_site.py --sources content/legacy --out site-build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - name: Check one-screen studio in Safari
        run: node scripts/test_schuine_worp_studio.mjs site-build webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schuine-worp-webkit
          path: test-results/worp-studio-*.png
