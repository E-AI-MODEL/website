name: Test compacte schuine worp in Safari
on:
  workflow_call:
    inputs:
      reuse_build:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  studio-webkit:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install beautifulsoup4
      - uses: ./.github/actions/checked-build
        with:
          reuse: ${{ inputs.reuse_build }}
      - name: Use the pinned browser runtime
        uses: ./.github/actions/browser-runtime
        with:
          binding: node
      - name: Check one-screen studio in Safari
        run: node scripts/test_schuine_worp_studio.mjs site-build webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schuine-worp-webkit-${{ github.run_attempt }}
          path: test-results/worp-studio-*.png
