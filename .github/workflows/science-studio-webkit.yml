name: Test compacte schuine worp in Safari
on:
  workflow_call:
    inputs:
      reuse_build:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
jobs:
  studio-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install beautifulsoup4
      - uses: ./.github/actions/checked-build
        with:
          reuse: ${{ inputs.reuse_build }}
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-1.56.1-webkit
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - name: Check one-screen studio in Safari
        run: node scripts/test_schuine_worp_studio.mjs site-build webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schuine-worp-webkit
          path: test-results/worp-studio-*.png
