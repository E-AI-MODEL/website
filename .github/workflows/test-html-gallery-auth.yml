name: Test gallery authentication

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Worker modules and password tool
        run: |
          node --check services/html-galerij/src/index.js
          node --check services/html-galerij/src/auth.js
          node --check services/html-galerij/src/ui.js
          node --check services/html-galerij/src/admin.js
          node --check services/html-galerij/src/dashboard.js
          node --check services/html-galerij/src/admin-client.js
          node --check services/html-galerij/scripts/password-hash.mjs
      - name: Test login, sessions, authorization, CSRF, and deletion
        run: node tests/test_html_galerij_admin.mjs
      - name: Test website management sources, access boundaries and audit actions
        run: node tests/test_eai_site_admin.mjs

      - name: Test the complete gallery with a real SQLite transaction
        run: node tests/test_html_gallery_sqlite.mjs
  live-anonymous:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check anonymous production requests without real files or credentials
        run: node tests/test_html_gallery_live.mjs
