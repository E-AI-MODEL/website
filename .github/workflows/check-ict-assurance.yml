name: ICT-registers en deterministische controles

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Optionele controledatum (jjjj-mm-dd); leeg gebruikt de huidige UTC-datum.'
        required: false
        type: string
  schedule:
    - cron: '23 5 * * *'


permissions:
  contents: read

concurrency:
  group: ict-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Bronintegriteit, controles en regressies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lees de repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gebruik Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Controleer regels, bronimport en kaartwijzigingen
        run: |
          node --test tests/test_ict_scan_assurance*.mjs tests/test_ict_scan_cards.mjs tests/test_ict_scan_github_sync.mjs tests/test_ict_scan_taxonomy.mjs
          node tests/test_ict_scan_export.mjs
          python3 -m unittest discover -s tests -p 'test_ict_scan_publish.py' -v
      - name: Installeer de browser voor de gebruikersproef
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ict-assurance-browser" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/ict-assurance-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Doorloop import, controles en vergelijking in de browser
        env:
          ASSURANCE_PLAYWRIGHT_ROOT: ${{ runner.temp }}/ict-assurance-browser
          ASSURANCE_BROWSER_OUTPUT: artifacts/ict-assurance-browser
        run: node tests/verify_ict_assurance_browser.mjs
      - name: Maak een controleverslag van de bronbestanden
        if: ${{ !cancelled() }}
        env:
          ASSURANCE_AS_OF: ${{ inputs.as_of }}
        shell: bash
        run: |
          set -euo pipefail
          ASSURANCE_ARGS=(--output artifacts/ict-assurance.json)
          if [[ -n "${ASSURANCE_AS_OF:-}" ]]; then
            ASSURANCE_ARGS+=(--as-of "$ASSURANCE_AS_OF")
          fi
          node scripts/check_ict_assurance.mjs "${ASSURANCE_ARGS[@]}" > /dev/null
      - name: Bewaar het controleverslag
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ict-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ict-assurance.json
            artifacts/ict-assurance-browser/
          if-no-files-found: error
          retention-days: 14
