name: Audit archive and linked tools
on:
  workflow_call:
    inputs:
      reuse_build:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/checked-build
        with:
          reuse: ${{ inputs.reuse_build }}
      - name: Controleer de opgehaalde bouw
        run: |
          pip install beautifulsoup4
          python scripts/verify_ui.py --root site-build
          python -m unittest discover -s tests -p 'test_archive_review.py'
      - name: Inventory pages, links and live HTTP responses
        run: python scripts/audit_archive.py
      - name: Use the pinned browser runtime
        uses: ./.github/actions/browser-runtime
        with:
          binding: node
      - name: Inspect older pages in Chromium and WebKit
        run: |
          node scripts/audit_archive_session_test.mjs
          node scripts/audit_archive_ui.mjs
      - name: Test local tool workflows with synthetic inputs
        run: node scripts/audit_archive_functional.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-audit-evidence-${{ github.run_attempt }}
          retention-days: 14
          path: |
            audit-results/
            site-build/
            scripts/
            content/legacy/
