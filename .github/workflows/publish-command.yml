name: Open de geteste publicatieversie
on:
  issue_comment:
    types: [created]
permissions: {}
jobs:
  request-publication:
    if: github.event.comment.body == '/publish-eai' && github.event.comment.user.login == github.repository_owner && github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - name: Toon het formulier voor toestemming op een specifieke testversie
        run: |
          echo "[Kies de gevalideerde run en bevestig de publicatie](https://github.com/$GITHUB_REPOSITORY/actions/workflows/deploy-theory7.yml)." >> "$GITHUB_STEP_SUMMARY"
