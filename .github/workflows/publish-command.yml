name: Publish EAI on owner request

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  request-publication:
    if: >-
      github.event.comment.body == '/publish-eai' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Dispatch the existing production workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-theory7.yml --ref main --repo "$GH_REPO"
