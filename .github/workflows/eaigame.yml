name: Verify EAIgame expedition
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/eaigame/**'
      - 'assets/eaigame*'
      - 'tests/test_eaigame.mjs'
      - 'tests/test_eaigame_sites_levels.mjs'
      - 'scripts/test_eaigame_browser.mjs'
      - 'scripts/test_eaigame_sites_browser.mjs'
      - '.github/workflows/eaigame.yml'
  push:
    branches: [main]
    paths:
      - 'tools/eaigame/**'
      - 'assets/eaigame*'
      - 'tests/test_eaigame.mjs'
      - 'tests/test_eaigame_sites_levels.mjs'
      - 'scripts/test_eaigame_browser.mjs'
      - 'scripts/test_eaigame_sites_browser.mjs'
      - '.github/workflows/eaigame.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eaigame-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game modules
        run: |
          node --check assets/eaigame.js
          node --check assets/eaigame-world.js
          node --check assets/eaigame-random.js
          node --check assets/eaigame-randomizer.js
          node --check assets/eaigame-questions.js
          node --check assets/eaigame-ai.js
          node --check scripts/test_eaigame_browser.mjs
          node --check scripts/test_eaigame_sites_browser.mjs
          node --check assets/eaigame-sites-app.js
          node --check assets/eaigame-sites-island.js
          node --check assets/eaigame-sites-questions.js
          node --check assets/eaigame-sites-improvements.js
          node --check assets/eaigame-sites-level-bank.js
          node --check assets/eaigame-sites-level-pilots.js
          node --check assets/eaigame-sites-controls.js
          node --check assets/eaigame-sites-sessions.js
          node --check assets/eaigame-sites-learning.js
          node --check assets/eaigame-sites-editor.js
          node --check assets/eaigame-sites-3d.js
      - name: Verify questions and gameplay
        run: node --test tests/test_eaigame.mjs tests/test_eaigame_sites_levels.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Play full game on desktop, phone and offline fallback
        env:
          EAIGAME_REQUIRE_3D: '1'
        run: node scripts/test_eaigame_browser.mjs .
      - name: Verify original Sites interface and game flow on desktop and phone
        run: node scripts/test_eaigame_sites_browser.mjs .
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaigame-browser-evidence
          path: test-results/eaigame-*.png
          if-no-files-found: warn
