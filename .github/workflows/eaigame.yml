name: Verify EAIgame expedition
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: eaigame-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game modules
        run: |
          node --check assets/eaigame.js
          node --check assets/eaigame-world.js
          node --check assets/eaigame-random.js
          node --check assets/eaigame-randomizer.js
          node --check assets/eaigame-questions.js
          node --check assets/eaigame-ai.js
          node --check scripts/test_eaigame_browser.mjs
      - name: Verify questions and gameplay
        run: node --test tests/test_eaigame.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Play full game on desktop, phone and offline fallback
        env:
          EAIGAME_REQUIRE_3D: '1'
        run: node scripts/test_eaigame_browser.mjs .
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaigame-browser-evidence
          path: test-results/eaigame-*.png
          if-no-files-found: warn
