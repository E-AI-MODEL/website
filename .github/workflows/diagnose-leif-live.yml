name: Diagnose LEIF live byteverschil (alleen lezen)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-leif-live.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Vergelijk LEIF bronbestanden met HTTP-respons
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import Request, urlopen
          routes = ('leif/', 'leif/continue/', 'leif/verhaal/')
          for path in routes:
              local = (Path(path) / 'index.html').read_bytes()
              req = Request('https://eaimodel.nl/' + path, headers={'Cache-Control':'no-cache', 'User-Agent':'EAI-release-check/1.0'})
              with urlopen(req, timeout=25) as r:
                  remote=r.read()
                  headers=r.headers
              pos=next((i for i,(a,b) in enumerate(zip(local,remote)) if a!=b), min(len(local),len(remote)))
              print('ROUTE:',path,'equal=',local==remote,'local_size=',len(local),'remote_size=',len(remote),'first_diff=',pos,flush=True)
              print('LOCAL SHA:',hashlib.sha256(local).hexdigest(),'REMOTE SHA:',hashlib.sha256(remote).hexdigest(),flush=True)
              print('HEADERS:',{x:headers.get(x,'') for x in ('CF-Cache-Status','Age','Last-Modified','Content-Encoding','Server','Content-Type')},flush=True)
              print('CLOUDFLARE SCRIPTS:',remote.count(b'cloudflareinsights.com'),remote.count(b'/cdn-cgi/'),flush=True)
              if pos < max(len(local),len(remote)):
                  print('EXPECTED CONTEXT:',repr(local[max(0,pos-55):pos+175]),flush=True)
                  print('ACTUAL CONTEXT:',repr(remote[max(0,pos-55):pos+175]),flush=True)
          PY
