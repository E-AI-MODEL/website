name: Publiceer statistiekendashboard afzonderlijk

on:
  push:
    branches: [main]
    paths:
      - 'statistieken/index.html'
      - 'statistieken/demo.json'
      - '.github/workflows/deploy-analytics-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eai-statistieken-quick
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Controleer dashboard en testgegevens
        run: |
          set -euo pipefail
          node --test tests/test_public_analytics_ui.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          demo=json.loads(Path('statistieken/demo.json').read_text(encoding='utf-8'))
          assert demo['demo'] is True
          assert demo['visits']==500 and demo['unique_visitors']==143
          assert sum(row['visits'] for row in demo['daily']) == 500
          assert sum(row['views'] for row in demo['daily']) == demo['views']
          source=Path('statistieken/index.html').read_text(encoding='utf-8')
          assert 'id="demo-note"' in source
          assert '/statistieken/demo.json' in source
          assert '/statistieken/data.json' in source
          PY
      - name: Installeer FTPS-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp openssl
      - name: Controleer bestaand Theory7-certificaat
        shell: bash
        run: |
          set -euo pipefail
          expected="4D:F5:15:4C:F3:11:5E:5B:DD:91:BD:5F:BD:0F:0E:A7:35:71:5C:32"
          actual="$(openssl s_client -starttls ftp -connect ftp.eaimodel.nl:21 -servername ftp.eaimodel.nl </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)"
          test "$actual" = "$expected" || { echo "Onverwacht FTPS-certificaat. Geen upload."; exit 1; }
      - name: Publiceer uitsluitend dashboard en demo
        shell: bash
        env:
          FTP_USER: ${{ secrets.THEORY7_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.THEORY7_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://ftp.eaimodel.nl:21" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:timeout 20
          set net:max-retries 1
          set xfer:use-temp-file yes
          mkdir -p /statistieken
          put statistieken/demo.json -o /statistieken/demo.json
          put statistieken/index.html -o /statistieken/index.html
          bye
          EOF
      - name: Controleer live demo zonder echte cijfers te veranderen
        env:
          RELEASE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os,time
          from urllib.request import Request,urlopen
          base="https://eaimodel.nl/statistieken/"
          for i in range(8):
              try:
                  html=urlopen(Request(base+"?check="+os.environ["RELEASE"],headers={"Cache-Control":"no-cache"}),timeout=22).read().decode("utf-8")
                  demo=json.loads(urlopen(base+"demo.json?check="+os.environ["RELEASE"],timeout=22).read())
                  live=json.loads(urlopen(base+"data.json?check="+os.environ["RELEASE"],timeout=22).read())
                  assert 'id="unique"' in html and 'id="demo-note"' in html
                  assert demo['demo'] is True and demo['visits']==500 and demo['unique_visitors']==143
                  assert live['source']=="Cloudflare Web Analytics (RUM)" and not live.get('demo',False)
                  print("Live dashboard, fictieve demo en echte Cloudflare-data gescheiden gecontroleerd")
                  break
              except (ValueError,AssertionError,TimeoutError,OSError) as exc:
                  print("Nog niet zichtbaar:",type(exc).__name__,i+1)
                  if i==7: raise
                  time.sleep(7)
          PY
