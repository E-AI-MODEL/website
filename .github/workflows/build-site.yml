name: Build EAI Site

on:
  workflow_call:
    inputs:
      selection:
        type: string
        required: true
      eaispeak_artifact:
        type: boolean
        default: false
      central_validation:
        description: De centrale site-check voert de gedeelde bron- en UI-proeven uit
        type: boolean
        default: false
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lees de centrale testselectie
        id: scope
        env:
          SELECTION: ${{ inputs.selection }}
        run: |
          if [[ -z "$SELECTION" ]]; then
            python3 scripts/ci_pr_scope.py --all --output "$GITHUB_OUTPUT"
          else
            jq -er 'to_entries[] | "\(.key)=\(.value)"' <<<"$SELECTION" >> "$GITHUB_OUTPUT"
          fi
      - name: Controleer selectie van tests
        if: ${{ !inputs.central_validation }}
        run: python3 -m unittest discover -s tests -p 'test_ci_pr_scope.py' -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Use Node.js 22 for the 3D atlas and existing JavaScript tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Test exact Theory7 hashes with Cloudflare beacon injection
        run: python -m unittest discover -s tests -p 'test_theory7_cloudflare_hash.py' -v

      - name: Check review PDF workflow never overwrites site HTML or JS
        run: python -m unittest discover -s tests -p 'test_zhang_workflow_isolation.py' -v

      - name: Test homepage and model rendering
        run: python -m unittest discover -s tests -p 'test_home_model.py' -v

      - name: Check shared dashboard-card scope and homepage content
        if: ${{ !inputs.central_validation && steps.scope.outputs.home == 'true' }}
        run: python -m unittest discover -s tests -p 'test_dashboard_cards.py' -v

      - name: Check LEIF access and tenants in a standalone build
        if: ${{ !inputs.central_validation && steps.scope.outputs.leif == 'true' }}
        run: node --test tests/test_leif_kei.mjs tests/test_leif_multitenant.mjs
      - name: Test LEIF en het toevoegen van testers
        if: ${{ steps.scope.outputs.leif == 'true' }}
        run: node --test tests/test_leif_testers.mjs tests/test_leif_unified_login.mjs tests/test_leif_site_texts.mjs

      - name: Verify Cloudflare beacon on public sitemap pages
        run: python -m unittest discover -s tests -p 'test_cloudflare_beacon.py' -v

      - name: Check local-only ICT scan publishing
        run: python -m unittest discover -s tests -p 'test_ict_scan_publish.py' -v

      - name: Test ICT scan Excel reports and AI categorization
        if: ${{ steps.scope.outputs.ictscan == 'true' }}
        run: node tests/test_ict_scan_export.mjs

      - name: Controleer de brondata en JSON-import van Applicatielandschap 2026
        if: ${{ steps.scope.outputs.ictscan == 'true' }}
        run: |
          node --check tools/ict-scan/app.js
          node --check tools/ict-scan/enhancements.js
          node --check tools/ict-scan/github-sync.js
          node --check tools/ict-scan/visual-explorer.js
          node --check tools/ict-scan/record-cards.js
          node --check tools/ict-scan/record-github.js
          node --check tools/ict-scan/answer-engine.js
          node --test tests/test_ict_scan_2026_data.mjs tests/test_ict_scan_visuals.mjs tests/test_ict_scan_cards.mjs tests/test_ict_scan_answers.mjs

      - name: Check first-party clicks and session privacy
        run: |
          php -l statistieken/collect.php
          node --check assets/site-analytics.js
          python -m unittest discover -s tests -p 'test_first_party_analytics.py' -v

      - name: Check published analytics totals and privacy
        run: python -m unittest discover -s tests -p 'test_public_analytics.py' -v

      - name: Check public dashboard JavaScript and labels
        run: node --test tests/test_public_analytics_ui.mjs

      - name: Check website insights and menu
        run: python -m unittest discover -s tests -p 'test_site_insights.py' -v
      - name: Check compact NL and EN menus
        run: python -m unittest discover -s tests -p 'test_site_menu_groups.py' -v
      - name: Check bilingual EAI Dictionary and semantic menu links
        run: python -m unittest discover -s tests -p 'test_dictionary_and_menu.py' -v
      - name: Check editorial card scope excludes interactive labs
        if: ${{ !inputs.central_validation }}
        run: python -m unittest discover -s tests -p 'test_story_cards.py' -v

      - name: Check EAIwork public /work/ entry
        run: python -m unittest discover -s tests -p 'test_eaiwork_public_entry.py' -v

      - name: Check EAIwork public demonstration
        if: ${{ steps.scope.outputs.eaiwork == 'true' }}
        run: python -m unittest discover -s tests -p 'test_eaiwork_dashboard_publish.py' -v

      - name: Test EAIgit browser analysis
        if: ${{ !inputs.central_validation && steps.scope.outputs.eaigit == 'true' }}
        run: node --test tests/test_projecthulp.mjs tests/test_eaigit_help.mjs tests/test_eaigit_single_file.mjs

      - name: Check EAIgame 300 questions and gameplay mechanics
        if: ${{ !inputs.central_validation && steps.scope.outputs.eaigame == 'true' }}
        run: node --test tests/test_eaigame.mjs

      - name: Download the already browser-tested EAIspeak bundle
        if: ${{ inputs.eaispeak_artifact }}
        uses: actions/download-artifact@v4
        with:
          name: eaispeak-tested-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eaispeak-release
      - name: Prepare EAIspeak before generating the public site
        if: ${{ inputs.eaispeak_artifact }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/eaispeak-release"
          test "$(cat "$bundle/build-sha.txt")" = "$GITHUB_SHA"
          (cd "$bundle" && sha256sum -c SHA256SUMS)
          mkdir -p tools/eaispeak/dist
          cp -a "$bundle/tools/eaispeak/." tools/eaispeak/dist/
      - name: Build EAIspeak for standalone diagnostic run only
        if: ${{ !inputs.eaispeak_artifact }}
        working-directory: tools/eaispeak
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Build site
        run: |
          python scripts/build_site.py --sources content/legacy --out site-build
          test -s site-build/tools/eaispeak/index.html
          test -s site-build/tools/delf-live/index.html
          # TOPO is a complete, independently deployed application.
          test ! -e site-build/topo/index.html
          test -s topo/index.html
          test -s topo/instellingen/index.html
          test -s topo/nederland/index.html
          test -s site-build/statistieken/demo.json
          test -s site-build/statistieken/collect.php
          test -s site-build/assets/site-analytics.js
          test ! -e site-build/statistieken/data.json

      - name: Controleer verborgen lokale ICT-scan
        run: |
          node --test tests/test_ict_scan_github_sync.mjs
          test -s site-build/tools/ict-scan/index.html
          test -s site-build/tools/ict-scan/app.js
          test -s site-build/tools/ict-scan/style.css
          test -s site-build/tools/ict-scan/monitor.css
          test -s site-build/tools/ict-scan/enhancements.js
          test -s site-build/tools/ict-scan/github-sync.js
          test ! -e site-build/tools/ict-scan/bronnen
          test ! -e site-build/ict-scan/bronnen
          test -s site-build/tools/ict-scan/rail-drawer.js
          test -s site-build/tools/ict-scan/visual-explorer.js
          test -s site-build/tools/ict-scan/visual-explorer.css
          test -s site-build/tools/ict-scan/record-cards.js
          test -s site-build/tools/ict-scan/record-github.js
          test -s site-build/tools/ict-scan/record-cards.css
          test -s site-build/tools/ict-scan/frameworks.json
          test -s site-build/tools/ict-scan/answer-engine.js
          test -s site-build/tools/ict-scan/answer-engine.css
          node --check tools/ict-scan/rail-drawer.js
          node --check tools/ict-scan/github-sync.js
          test -s site-build/tools/ict-scan/emmaus-logo.svg
          ! grep -q 'https://eaimodel.nl/tools/ict-scan/' site-build/sitemap.xml

      - name: Controleer EAIgit in gebouwde website
        run: |
          set -euo pipefail
          test -s site-build/tools/eaigit/index.html
          test -s site-build/tools/eaigit/hulp/index.html
          test -s site-build/tools/eaigit/prompts/index.html
          test -s site-build/tools/projecthulp/index.html
          test -s site-build/assets/eaigit/wizard.mjs
          test -s site-build/assets/projecthulp/analyse.mjs
          test -s site-build/assets/projecthulp/inhoudscontrole.mjs
          test -s site-build/assets/projecthulp/onderzoek-worker.mjs
          test -s site-build/assets/projecthulp/los-bestand.mjs

      - name: Build local anatomical 3D models and viewer
        run: python scripts/build_anatomie.py --out site-build/tools/anatomie

      - name: Test physiological sequence in Hartslaglab
        if: ${{ steps.scope.outputs.heart == 'true' }}
        run: node scripts/test_hartslaglab_cycle.mjs
      - name: Check 3D anatomy geometry in Hartslaglab
        if: ${{ steps.scope.outputs.heart == 'true' }}
        run: node scripts/test_hartslaglab_geometry.mjs
      - name: Verify anatomical atlas, licensing and navigation
        run: python -m unittest discover -s tests -p 'test_anatomie_publish.py' -v

      - name: Check HTML upload link in header
        run: python -m unittest discover -s tests -p 'test_header_upload_link.py' -v

      - name: Check HTML gallery static publication
        run: |
          python -m unittest discover -s tests -p 'test_html_galerij_publish.py' -v
          python -m unittest discover -s tests -p 'test_eai_site_admin_publish.py' -v

      - name: Check HTML gallery admin routes and client script
        if: ${{ !inputs.central_validation }}
        run: |
          node tests/test_html_galerij_admin.mjs
          node tests/test_eai_site_admin.mjs
          node tests/test_html_gallery_sqlite.mjs

      - name: Check WiHTML pages and reviewed studio copy
        run: python -m unittest discover -s tests -p "test_wihtml_publish.py" -v

      - name: Check LLM observatory source and menus
        if: ${{ steps.scope.outputs.llm == 'true' }}
        run: python -m unittest discover -s tests -p 'test_llm_observatorium_source.py' -v

      - name: Check ABYSS source and mobile menu
        run: python -m unittest discover -s tests -p 'test_abyss_publish.py' -v

      - name: Check Science Observatory pilot publication
        if: ${{ always() && !cancelled() }}
        run: python -m unittest discover -s tests -p 'test_science_observatory_publish.py' -v
      - name: Check adaptive mathematics and physics workspaces
        if: ${{ steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_adaptive_workspaces.mjs
      - name: Check physics reference values and drawings
        if: ${{ !inputs.central_validation && steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physics_models.mjs
      - name: Check wave motion and optical models
        if: ${{ !inputs.central_validation && steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physics_round3.mjs
      - name: Check 53 proefspecifieke natuurkundeberekeningen
        if: ${{ !inputs.central_validation && steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physics_insights.mjs
      - name: Check physics source references and independent calculations
        if: ${{ !inputs.central_validation && steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physics_evidence.mjs
      - name: Check independent model references for the other 48 physics labs
        if: ${{ !inputs.central_validation && steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physics_reference_48.mjs
      - name: Check physics visuals against the simulated equations
        if: ${{ !inputs.central_validation && steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physics_visual_fidelity.mjs
      - name: Check physical graph axes and comparisons
        if: ${{ !inputs.central_validation && steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_physical_graphs.mjs
      - name: Check animation, graph and measurement agreement
        if: ${{ !inputs.central_validation && steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_graph_animation_alignment.mjs
      - name: Check three experiment-specific inquiry methods
        if: ${{ !inputs.central_validation && steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_inquiry_variants.mjs
      - name: Check quality register for all 53 physics experiments
        if: ${{ steps.scope.outputs.physics == 'true' }}
        run: node --test tests/test_science_quality_register.mjs

      - name: Check Melkweg Lab publication
        if: ${{ steps.scope.outputs.melkweg == 'true' }}
        run: python -m unittest discover -s tests -p 'test_melkweg_lab_publish.py' -v

      - name: Verify EAIstudio and EAImesh source publication
        run: python -m unittest discover -s tests -p 'test_tool_launch.py' -v

      - name: Validate internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup

          root = Path("site-build")
          failures = []

          def target_for(href: str) -> Path | None:
              if not href.startswith("/") or href.startswith("//"):
                  return None
              path = urlsplit(href).path
              if path == "/":
                  return root / "index.html"
              rel = path.lstrip("/")
              candidate = root / rel
              if path.endswith("/"):
                  return candidate / "index.html"
              if candidate.is_file():
                  return candidate
              return candidate / "index.html"

          for page in root.rglob("*.html"):
              soup = BeautifulSoup(page.read_text(encoding="utf-8"), "html.parser")
              for a in soup.find_all("a", href=True):
                  href = a["href"].strip()
                  target = target_for(href)
                  if target is not None and not target.exists():
                      # Model pages are rendered in the next preparation step.
                      if urlsplit(href).path in ("/nl/model/", "/en/model/"):
                          continue
                      failures.append((str(page.relative_to(root)), href))

          if failures:
              print("Broken internal links:")
              for page, href in failures:
                  print(f"  {page}: {href}")
              raise SystemExit(1)

          print("Internal link check passed")
          PY

      - name: Check visitor routes and shared styling
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          root = Path("site-build")
          problems = []
          for route in ("index.html", "nl/index.html", "statistieken/index.html", "nl/onderwijs/index.html",
                        "nl/onderzoek/index.html", "nl/model-monitor/index.html", "leif/index.html", "leif/continue/index.html", "leif/verhaal/index.html", "tools/wihtml/index.html", "tools/wihtml/studio/index.html"):
              if not (root / route).exists():
                  problems.append(f"Missing visitor route: {route}")
          home = root / "nl/index.html"
          if home.exists():
              soup = BeautifulSoup(home.read_text(encoding="utf-8"), "html.parser")
              cards = soup.select(".eai-landing-route")
              if len(cards) != 4:
                  problems.append(f"Expected four homepage routes, got {len(cards)}")
              for card in cards:
                  a = card.get("href", "")
                  if not a:
                      problems.append("Homepage entrance without link")
          css = root / "assets/editorial-finish.css"
          if not css.exists() or not css.read_text(encoding="utf-8").strip():
              problems.append("Shared editorial stylesheet is missing or empty")
          for route in ("publicaties/index.html", "werkvormen/index.html", "onderbouwing/index.html"):
              page = root / route
              if not page.exists():
                  continue
              soup = BeautifulSoup(page.read_text(encoding="utf-8"), "html.parser")
              # Redesigned pages already own their styling and navigation.
              # The legacy generator deliberately does not inject into them.
              if soup.select_one("body.eai-refresh, body.eai-ui"):
                  continue
              if not soup.select_one('link[data-eai-editorial="true"]'):
                  problems.append(f"Shared styling not linked: {route}")
              if not soup.select_one(".eai-editorial-onward"):
                  problems.append(f"Further-reading routes missing: {route}")
          if problems:
              raise SystemExit("\\n".join(problems))
          print("Visitor route and shared styling checks passed")
          PY

      - name: Bereid de definitieve site voor en leg de bestanden vast
        run: |
          python scripts/prepare_ui.py --root site-build
          if [[ "${{ inputs.eaispeak_artifact }}" == "true" ]]; then
            bundle="$RUNNER_TEMP/eaispeak-release"
            test "$(cat "$bundle/build-sha.txt")" = "$GITHUB_SHA"
            (cd "$bundle" && sha256sum -c SHA256SUMS)
            mkdir -p site-build/tools/eaispeak site-build/tools/delf-live
            cp -a "$bundle/tools/eaispeak/." site-build/tools/eaispeak/
            cp -a "$bundle/tools/delf-live/." site-build/tools/delf-live/
            (cd site-build && sha256sum -c "$bundle/SHA256SUMS")
          fi
          test -s site-build/tools/eaispeak/index.html
          test -s site-build/tools/delf-live/index.html
          test -d site-build/tools/eaispeak/assets
          python scripts/verify_ui.py --root site-build
          python scripts/release_artifact.py create --root site-build --manifest release-manifest.json --commit "$GITHUB_SHA"
      - name: Bewaar de bouw voor alle testjobs in deze run
        uses: actions/upload-artifact@v4
        with:
          name: site-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            site-build/
            release-manifest.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 1
          retention-days: 30
