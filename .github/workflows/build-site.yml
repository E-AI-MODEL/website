name: Build EAI Site

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-site.yml'
      - '.github/workflows/deploy-theory7.yml'
      - 'scripts/build_site.py'
      - 'scripts/build_anatomie.py'
      - 'tests/test_anatomie_publish.py'
      - 'content/**'
      - 'nl/**'
      - 'en/**'
      - 'assets/**'
      - 'index.html'
      - 'houseoftalents/**'
      - 'leif/**'
      - 'tests/test_home_model.py'
      - 'tests/test_eaiwork_dashboard_publish.py'
      - 'tests/test_science_observatory_publish.py'
      - 'tests/test_abyss_publish.py'
      - 'tests/test_llm_observatorium_source.py'
      - 'scripts/home_model.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-site.yml'
      - '.github/workflows/deploy-theory7.yml'
      - 'scripts/build_site.py'
      - 'scripts/build_anatomie.py'
      - 'tests/test_anatomie_publish.py'
      - 'content/**'
      - 'nl/**'
      - 'en/**'
      - 'assets/**'
      - 'index.html'
      - 'houseoftalents/**'
      - 'leif/**'
      - 'tests/test_home_model.py'
      - 'tests/test_science_observatory_publish.py'
      - 'tests/test_abyss_publish.py'
      - 'tests/test_llm_observatorium_source.py'
      - 'scripts/home_model.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eai-site-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Use Node.js 22 for the 3D atlas and existing JavaScript tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Test homepage and model rendering
        run: python -m unittest discover -s tests -p 'test_home_model.py' -v

      - name: Test LEIF en het toevoegen van testers
        run: node --test tests/test_leif_kei.mjs tests/test_leif_multitenant.mjs tests/test_leif_testers.mjs tests/test_leif_unified_login.mjs tests/test_leif_site_texts.mjs

      - name: Check website insights and menu
        run: python -m unittest discover -s tests -p 'test_site_insights.py' -v

      - name: Check EAIwork public demonstration
        run: python -m unittest discover -s tests -p 'test_eaiwork_dashboard_publish.py' -v

      - name: Build site
        run: |
          python scripts/build_site.py --sources content/legacy --out site-build

      - name: Build local anatomical 3D models and viewer
        run: python scripts/build_anatomie.py --out site-build/tools/anatomie

      - name: Verify anatomical atlas, licensing and navigation
        run: python -m unittest discover -s tests -p 'test_anatomie_publish.py' -v

      - name: Check site insights, navigation and privacy
        run: python -m unittest discover -s tests -p 'test_site_insights.py' -v

      - name: Check WiHTML pages and reviewed studio copy
        run: python -m unittest discover -s tests -p "test_wihtml_publish.py" -v

      - name: Check LLM observatory source and menus
        run: python -m unittest discover -s tests -p 'test_llm_observatorium_source.py' -v

      - name: Check ABYSS source and mobile menu
        run: python -m unittest discover -s tests -p 'test_abyss_publish.py' -v

      - name: Check Science Observatory pilot publication
        run: python -m unittest discover -s tests -p 'test_science_observatory_publish.py' -v

      - name: Check Melkweg Lab publication
        run: python -m unittest discover -s tests -p 'test_melkweg_lab_publish.py' -v

      - name: Verify EAIstudio and EAImesh source publication
        run: python -m unittest discover -s tests -p 'test_tool_launch.py' -v

      - name: Validate internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup

          root = Path("site-build")
          failures = []

          def target_for(href: str) -> Path | None:
              if not href.startswith("/") or href.startswith("//"):
                  return None
              path = urlsplit(href).path
              if path == "/":
                  return root / "index.html"
              rel = path.lstrip("/")
              candidate = root / rel
              if path.endswith("/"):
                  return candidate / "index.html"
              if candidate.is_file():
                  return candidate
              return candidate / "index.html"

          for page in root.rglob("*.html"):
              soup = BeautifulSoup(page.read_text(encoding="utf-8"), "html.parser")
              for a in soup.find_all("a", href=True):
                  href = a["href"].strip()
                  target = target_for(href)
                  if target is not None and not target.exists():
                      # Model pages are rendered in the next preparation step.
                      if urlsplit(href).path in ("/nl/model/", "/en/model/"):
                          continue
                      failures.append((str(page.relative_to(root)), href))

          if failures:
              print("Broken internal links:")
              for page, href in failures:
                  print(f"  {page}: {href}")
              raise SystemExit(1)

          print("Internal link check passed")
          PY

      - name: Check visitor routes and shared styling
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          root = Path("site-build")
          problems = []
          for route in ("index.html", "nl/index.html", "nl/onderwijs/index.html",
                        "nl/onderzoek/index.html", "nl/model-monitor/index.html", "leif/index.html", "leif/continue/index.html", "leif/verhaal/index.html", "tools/wihtml/index.html", "tools/wihtml/studio/index.html"):
              if not (root / route).exists():
                  problems.append(f"Missing visitor route: {route}")
          home = root / "nl/index.html"
          if home.exists():
              soup = BeautifulSoup(home.read_text(encoding="utf-8"), "html.parser")
              cards = soup.select(".eai-landing-route")
              if len(cards) != 4:
                  problems.append(f"Expected four homepage routes, got {len(cards)}")
              for card in cards:
                  a = card.get("href", "")
                  if not a:
                      problems.append("Homepage entrance without link")
          css = root / "assets/editorial-finish.css"
          if not css.exists() or not css.read_text(encoding="utf-8").strip():
              problems.append("Shared editorial stylesheet is missing or empty")
          for route in ("publicaties/index.html", "werkvormen/index.html", "onderbouwing/index.html"):
              page = root / route
              if not page.exists():
                  continue
              soup = BeautifulSoup(page.read_text(encoding="utf-8"), "html.parser")
              # Redesigned pages already own their styling and navigation.
              # The legacy generator deliberately does not inject into them.
              if soup.select_one("body.eai-refresh, body.eai-ui"):
                  continue
              if not soup.select_one('link[data-eai-editorial="true"]'):
                  problems.append(f"Shared styling not linked: {route}")
              if not soup.select_one(".eai-editorial-onward"):
                  problems.append(f"Further-reading routes missing: {route}")
          if problems:
              raise SystemExit("\\n".join(problems))
          print("Visitor route and shared styling checks passed")
          PY

      - name: Publish generated files to main
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
            echo "A newer commit exists on main; this run is stale and will not publish generated files."
            exit 0
          fi

          rm -rf assets publicaties tools model-monitor eai-blog eai-tools-modules eaa-model onderwijsin houseoftalents twee-pijlers workshop-ai werkvormen taalwerkvormen onderbouwing bronnen praktijk over verdieping toepassingen onderwijs kennis
          cp -R site-build/assets .
          cp -R site-build/publicaties .
          cp -R site-build/tools .
          cp -R site-build/model-monitor .
          cp -R site-build/eai-blog .
          cp -R site-build/eai-tools-modules .
          cp -R site-build/eaa-model .
          cp -R site-build/onderwijsin .
          cp -R site-build/houseoftalents .
          cp -R site-build/twee-pijlers .
          cp -R site-build/workshop-ai .
          cp -R site-build/werkvormen .
          cp -R site-build/taalwerkvormen .
          cp -R site-build/onderbouwing .
          cp -R site-build/bronnen .
          cp -R site-build/praktijk .
          cp -R site-build/over .
          cp -R site-build/verdieping .
          cp -R site-build/toepassingen .
          cp -R site-build/onderwijs .
          cp -R site-build/kennis .
          cp site-build/index.html site-build/404.html site-build/robots.txt site-build/sitemap.xml .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html robots.txt sitemap.xml assets publicaties tools model-monitor eai-blog eai-tools-modules eaa-model onderwijsin houseoftalents twee-pijlers workshop-ai werkvormen taalwerkvormen onderbouwing bronnen praktijk over verdieping toepassingen onderwijs kennis
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh EAI site"
            git push origin HEAD:main
          fi
