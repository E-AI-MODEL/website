name: LO Aanvalslab - browsercontrole
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.2-noble
      options: --shm-size=1g
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Gebruik de vaste Chromium- en WebKit-omgeving
        id: browsers
        uses: ./.github/actions/browser-runtime
        with:
          binding: python
      - name: Controleer mobiele spelbediening
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: python scripts/test_lo_calm_mobile.py
      - name: Test zichtbaarheid, bronpagina en publicatie
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python -m unittest discover -s tests -p 'test_lo_evidence_publish.py' -v
      - name: Test spelberekeningen, desktop, mobiel en verborgen analyse
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: |
          # The container user and runner-owned checkout can differ.
          # Trust only this checkout, not every repository on the runner.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify origin/main
          git cat-file -e origin/main:tools/lo-aanvalslab/index.html
          python scripts/test_lo_easteregg.py
      - name: Controleer sporten, verdedigende tactiek en bewegingen
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: python scripts/test_lo_v13_simulations.py
      - name: Controleer zonevormen, doelpogingen en lokale duo-opstelling
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: python scripts/test_lo_zone.py
      - name: Controleer dat de server nieuwe opdrachten accepteert
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          grep -q "'zonecompact','zoneschuif','zonelijn'" backend/lo-duo/index.ts
      - name: Bewaar mobiele proefbeelden
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lo-rustige-mobiele-schermen-${{ github.run_attempt }}
          path: artifacts/lo-calm-mobile/*.png
          if-no-files-found: ignore
          retention-days: 7
