name: Controleer Cloudflare-meting op de live website

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-cloudflare.yml'
      - 'scripts/verify_live_cloudflare.py'
      - 'tests/test_live_cloudflare.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-cloudflare.yml'
      - 'scripts/verify_live_cloudflare.py'
      - 'tests/test_live_cloudflare.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Controleer meetcode op Theory7
        run: python3 scripts/verify_live_cloudflare.py
