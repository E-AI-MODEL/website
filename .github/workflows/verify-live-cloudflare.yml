name: Controleer Cloudflare-meting op de live website

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Controleer meetcode op Theory7
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from pathlib import Path
          cloudflare_source = Path('scripts/build_site.py').read_text(encoding='utf-8')

          expected_url = "https://static.cloudflareinsights.com/beacon.min.js"
          expected_token = "1aa5d5810d5a48e7bb8e5b2bac573e74"
          assert expected_url in cloudflare_source
          assert expected_token in cloudflare_source

          problems = []
          for domain, path in (
              ("eaimodel.nl", "/"),
              ("eaimodel.nl", "/nl/"),
              ("eaimodel.nl", "/statistieken/"),
              ("www.eaimodel.nl", "/nl/"),
          ):
              url = f"https://{domain}{path}?eai_beacon_check={os.environ['GITHUB_RUN_ID']}"
              ok = False
              for attempt in range(3):
                  try:
                      with urlopen(
                          Request(url, headers={"Cache-Control": "no-cache"}),
                          timeout=18,
                      ) as response:
                          html = response.read(1_000_000).decode("utf-8", "replace")
                      ok = expected_url in html and expected_token in html
                      print(f"{domain}{path}: {'beacon aanwezig' if ok else 'beacon ontbreekt'}")
                      if ok:
                          break
                  except (HTTPError, URLError, TimeoutError) as exc:
                      print(f"{domain}{path}: verzoek mislukte ({type(exc).__name__})")
                  time.sleep(3)
              if not ok:
                  problems.append(f"https://{domain}{path}")
          if problems:
              raise SystemExit("De juiste Cloudflare-meetcode ontbreekt op: " + ", ".join(problems))
          print("Cloudflare-meetcode live gecontroleerd voor beide domeinnamen.")
          PY
