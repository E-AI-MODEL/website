name: Publish EAIwork dashboard to Theory7

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# One upload queue for all jobs writing site-wide Theory7 files.

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify self-contained dashboard source
        run: |
          set -euo pipefail
          test -s content/eaiwork-dashboard.html
          grep -q 'function compactDashboard(live)' content/eaiwork-dashboard.html
          grep -q 'function dashRing(' content/eaiwork-dashboard.html
          grep -q 'registratie:registration' content/eaiwork-dashboard.html
      - name: Leg de vooraf gecontroleerde overdrachtsbestanden vast
        run: python3 scripts/recovery_files.py create content/eaiwork-dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-files/
            recovery-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: prepare
    environment: theory7-herstel
    concurrency:
      group: theory7-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Controleer de goedkeuring van de eigenaar
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e --arg id "$OWNER_ID" 'any(.[]; .state == "approved" and (.user.id|tostring) == $id and any(.environments[]; .name == "theory7-herstel"))'
      - uses: actions/download-artifact@v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
      - run: python3 scripts/recovery_files.py verify
      - run: cp -a recovery-files/. .
      - name: Install FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp openssl
      - name: Verify Theory7 FTPS certificate
        shell: bash
        run: |
          set -euo pipefail
          expected="4D:F5:15:4C:F3:11:5E:5B:DD:91:BD:5F:BD:0F:0E:A7:35:71:5C:32"
          actual="$(openssl s_client -starttls ftp -connect ftp.eaimodel.nl:21 -servername ftp.eaimodel.nl </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)"
          test "$actual" = "$expected"
      - name: Upload only EAIwork HTML to Theory7
        shell: bash
        env:
          FTP_USER: ${{ secrets.THEORY7_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.THEORY7_FTP_PASSWORD }}
        working-directory: recovery-files
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://ftp.eaimodel.nl:21" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:timeout 20
          set net:max-retries 1
          set xfer:use-temp-file yes
          put content/eaiwork-dashboard.html -o /tools/eaiwork/index.html
          bye
          EOF
      - name: Verify exact published dashboard bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import URLError
          import os, time
          expected=Path('content/eaiwork-dashboard.html').read_bytes()
          url='https://eaimodel.nl/tools/eaiwork/?v='+os.environ['GITHUB_SHA']
          for attempt in range(8):
              try:
                  with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=20) as response:
                      actual=response.read()
                  if actual==expected:
                      print(f'Exact public EAIwork dashboard verified ({len(actual)} bytes)')
                      break
                  print(f'Public HTML not yet identical ({len(actual)} bytes), attempt {attempt+1}')
              except (URLError,TimeoutError) as error:
                  print(f'Public check attempt {attempt+1}: {error}')
              if attempt==7:
                  raise SystemExit('Published EAIwork HTML differs from source')
              time.sleep(3)
          PY
