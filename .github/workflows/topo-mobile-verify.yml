name: TOPO mobile and country map verification
on:
  workflow_call:
  workflow_dispatch:


permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --shm-size=1g
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sourced TOPO questions and language bank
        run: node scripts/validate_topo_content.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the TOPO VO data bank and generated pages
        run: |
          node --check scripts/topo_vo/pagina/spel.js
          node --check scripts/topo_vo/pagina/start.js
          node scripts/validate_topo_vo_data.mjs
          python3 scripts/topo_vo/maak_paginas.py --check
      - name: Check the shared fixed-screen layer on all TOPO pages
        run: |
          node --check topo/vast-scherm.js
          python3 scripts/topo_vast_scherm.py --check
      - name: Use the pinned browser runtime
        uses: ./.github/actions/browser-runtime
        with:
          binding: node
      - name: Test national map, mobile keyboard and settings
        shell: bash
        run: |
          mkdir -p test-results/topo
          python3 -m http.server 8765 --bind 127.0.0.1 >test-results/topo/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          from urllib.request import urlopen

          for _ in range(100):
              try:
                  with urlopen("http://127.0.0.1:8765/topo/", timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  pass
              time.sleep(0.1)
          else:
              raise SystemExit("TOPO static server did not become ready")
          PY
          node scripts/test_topo_mobile.mjs
          node scripts/test_topo_vo.mjs
          node scripts/test_topo_fixed_screen.mjs
        env:
          TOPO_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topo-${{ matrix.browser }}-screenshots-${{ github.run_attempt }}
          path: |
            test-results/topo/
            test-results/topo-vo/
            test-results/topo-fixed/
