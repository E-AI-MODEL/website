name: Deploy to Theory7

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theory7-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy static site via FTPS
        shell: bash
        env:
          HOST: ${{ secrets.THEORY7_HOST }}
          FTP_USER: ${{ secrets.THEORY7_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.THEORY7_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$HOST:21" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:timeout 20
          set net:max-retries 1
          mirror -R --delete --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .gitignore \
            --exclude-glob README.md \
            --exclude-glob cgi-bin/ \
            --exclude-glob .well-known/ \
            ./ /
          bye
          EOF
