name: Deploy to Theory7
on:
  workflow_run:
    workflows: [Valideer de publicatieversie]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_run:
        description: Alleen voor herstel; runnummer van de geslaagde hoofdversie
        type: string
        required: true
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: theory7-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer vertrouwde workflow, tests, bronboom en bestandshashes
        id: release
        env:
          VALIDATION_RUN: ${{ github.event.workflow_run.id || inputs.validation_run }}
        run: python scripts/release_candidate.py "$VALIDATION_RUN" "$TARGET"
      - name: Registreer de upload onder de bestaande publicatiewachtrij
        id: deployment
        env:
          TREE: ${{ steps.release.outputs.tree }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: python scripts/release_deployment.py begin
      - run: pip install beautifulsoup4
        if: steps.deployment.outputs.id != ''
      - name: Install FTPS client
        if: steps.deployment.outputs.id != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp openssl
      - name: Verify Theory7 FTPS certificate fingerprint
        if: steps.deployment.outputs.id != ''
        shell: bash
        env:
          HOST: web0102.theory7.net
        run: |
          set -euo pipefail
          expected="4D:F5:15:4C:F3:11:5E:5B:DD:91:BD:5F:BD:0F:0E:A7:35:71:5C:32"
          actual="$(openssl s_client -starttls ftp -connect "$HOST:21" -servername "$HOST" </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected FTPS certificate fingerprint."
            exit 1
          fi
      - name: Controleer main direct voor de eerste overdracht
        if: steps.deployment.outputs.id != ''
        env:
          TREE: ${{ steps.release.outputs.tree }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .commit.tree.sha)" = "$TREE"
      - name: Publish assets before HTML
        if: steps.deployment.outputs.id != ''
        shell: bash
        env:
          HOST: web0102.theory7.net
          FTP_USER: ${{ secrets.THEORY7_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.THEORY7_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # The retired route must not be present in the validated release.
          test ! -e candidate/site-build/tools/science-observatory/labs/schuine-worp
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$HOST:21" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname true
          set net:timeout 20
          set net:max-retries 1
          set xfer:use-temp-file yes
          set net:connection-limit 4
          mirror -R --parallel=3 --verbose candidate/site-build/assets/ /assets/
          # The general exclude-glob assets/ also excludes nested asset folders.
          # Publish the anatomical viewer's generated JS, CSS and Draco helpers
          # explicitly, before making its HTML visible to visitors.
          mirror -R --parallel=3 --verbose candidate/site-build/tools/anatomie/assets/ /tools/anatomie/assets/
          # EAIspeak is published from the same tested release manifest.
          # Upload new hashed assets before switching the HTML; delete only inside these owned routes.
          mkdir -p /tools/eaispeak/assets
          mirror -R --parallel=3 --verbose candidate/site-build/tools/eaispeak/assets/ /tools/eaispeak/assets/
          mirror -R --delete --parallel=3 --verbose candidate/site-build/tools/eaispeak/ /tools/eaispeak/
          mkdir -p /tools/delf-live
          mirror -R --delete --parallel=3 --verbose candidate/site-build/tools/delf-live/ /tools/delf-live/
          # Publish the ICT directory's headers before its HTML. The host's
          # root .htaccess remains excluded from the site-wide mirror.
          mkdir -p /tools/ict-scan
          put candidate/site-build/tools/ict-scan/.htaccess -o /tools/ict-scan/.htaccess
          # TOPO is published independently and cannot be overwritten by a whole-site deploy.
          mirror -R --parallel=3 --verbose --exclude-glob topo/ --exclude-glob 'topo/**' --exclude-glob assets/ --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .htaccess --exclude-glob cgi-bin/ --exclude-glob .well-known/ candidate/site-build/ /
          # The general mirror intentionally preserves unrelated server files.
          # Remove only the explicitly retired standalone projectile directory.
          rm -r -f /tools/science-observatory/labs/schuine-worp
          bye
          EOF
      - name: Verify the retired projectile route and retained physics lab
        if: steps.deployment.outputs.id != ''
        run: |
          python - <<'PY'
          import time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, build_opener, HTTPRedirectHandler

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect())
          base = "https://eaimodel.nl"
          old = "/tools/science-observatory/labs/schuine-worp/"
          current = "/tools/science-observatory/labs/natuurkunde/"
          built = (Path("candidate/site-build") / current.strip("/") / "index.html").read_bytes()
          def read(route):
              req = Request(base + route + "?release-check=" + str(time.time_ns()),
                            headers={"Cache-Control": "no-cache", "User-Agent": "EAI-release-check/1.0"})
              try:
                  with opener.open(req, timeout=30) as resp:
                      return resp.status, resp.read()
              except HTTPError as exc:
                  return exc.code, b""

          for attempt in range(5):
              statuses = [read(old)[0], read(old + "index.html")[0]]
              status, body = read(current)
              if all(code in (404, 410) for code in statuses) and status == 200 and body == built:
                  print("Standalone projectile route gone; integrated physics matches validated build")
                  break
              if attempt == 4:
                  raise AssertionError(f"Retirement not verified: legacy={statuses}, physics={status}, exact={body == built}")
              time.sleep(4)
          PY
      - name: Verify exact live EAIspeak files and legacy redirect
        if: steps.deployment.outputs.id != ''
        run: python scripts/verify_eaispeak_live.py --root candidate/site-build --url https://eaimodel.nl
      - name: Verify live ICT-scan profile and validator version
        if: steps.deployment.outputs.id != ''
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          built = Path("candidate/site-build/tools/ict-scan")
          built_html = (built / "index.html").read_text(encoding="utf-8")
          expected_js = (built / "assurance/profile.js").read_bytes()
          expected_profile = (built / "assurance/profiles/emmauscollege.json").read_bytes()
          version = hashlib.sha256(expected_js).hexdigest()[:16]
          script_ref = "./assurance/profile.js?v=" + version
          assert script_ref in built_html, "De sitebuild moet de echte hash van de profielvalidator gebruiken"
          assert "hardwareGroups" in expected_js.decode("utf-8"), "De validator kent hardwareGroups niet"
          assert "hardwareGroups" in json.loads(expected_profile)["source"]["registerFiles"]

          base = "https://eaimodel.nl/tools/ict-scan/"
          def get(path):
              request = Request(base + path, headers={"Cache-Control": "no-cache", "User-Agent": "EAI-ICT-release-check/1.0"})
              with urlopen(request, timeout=35) as response:
                  assert response.status == 200, path
                  return response.read()

          error = ""
          for attempt in range(6):
              try:
                  live_html = get("?release=" + version).decode("utf-8")
                  assert script_ref in live_html, "De livepagina verwijst naar een oude profielvalidator"
                  live_js = get("assurance/profile.js?v=" + version)
                  assert live_js == expected_js, "De livevalidator wijkt af van de gevalideerde release"
                  live_profile = get("assurance/profiles/emmauscollege.json?release=" + version)
                  assert live_profile == expected_profile, "Het live organisatieprofiel wijkt af van de release"
                  error = ""
                  print("ICT-scan live: profiel, hardwareGroups en validatorversie komen overeen")
                  break
              except Exception as exc:
                  error = str(exc)
                  print(f"ICT-scan livecontrole {attempt + 1}/6: {error}", flush=True)
                  if attempt < 5:
                      time.sleep(4)
          if error:
              raise AssertionError("ICT-scan live niet synchroon: " + error)
          PY
      - name: Verify live HTML and exact asset hashes
        if: steps.deployment.outputs.id != ''
        run: python scripts/verify_ui.py --root candidate/site-build --url https://eaimodel.nl --timeout 90
      - name: Verify live anatomy JavaScript and stylesheets
        if: steps.deployment.outputs.id != ''
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request, urlopen
          from pathlib import Path
          base = 'https://eaimodel.nl'
          def release_open(url, timeout):
              return urlopen(Request(url, headers={
                  'User-Agent': 'EAI-release-check/1.0',
                  'Cache-Control': 'no-cache',
              }), timeout=timeout)
          html = release_open(base + '/tools/anatomie/', timeout=30).read().decode('utf-8')
          for kind, pattern, expected in (
              ('javascript', r'<script[^>]+src="(/tools/anatomie/assets/[^"]+[.]js)"', ('javascript', 'ecmascript')),
              ('stylesheet', r'<link[^>]+href="(/tools/anatomie/assets/[^"]+[.]css)"', ('css',)),
          ):
              match = re.search(pattern, html)
              assert match, f'Live anatomy {kind} asset link missing'
              path = match.group(1)
              local = Path('candidate/site-build') / path.lstrip('/')
              assert local.is_file(), f'Build is missing {path}'
              with release_open(base + path, timeout=35) as response:
                  content = response.read()
                  ct = response.headers.get('Content-Type', '').lower()
                  assert response.status == 200, (kind, response.status)
                  assert any(part in ct for part in expected), (kind, ct)
                  assert content == local.read_bytes(), (kind, 'Remote content differs')
              print(f'{kind}: {path} ({len(content)} bytes)')
          PY
      - name: Verify published Hartslaglab including the real 3D meshes
        if: steps.deployment.outputs.id != ''
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          relative = 'tools/anatomie/labs/hartslag/'
          def release_open(url, timeout):
              return urlopen(Request(url, headers={
                  'User-Agent': 'EAI-release-check/1.0',
                  'Cache-Control': 'no-cache',
              }), timeout=timeout)
          local = Path('candidate/site-build') / relative
          with release_open('https://eaimodel.nl/' + relative, timeout=35) as response:
              page = response.read().decode('utf-8')
              assert response.status == 200
              assert 'id="mechanicsToggle"' not in page
              assert 'id="playbackDuration"' in page

          manifest = json.loads((local / 'atlas-heart-rich.json').read_text(encoding='utf-8'))
          assert manifest['sourceMeshCount'] == 34
          assert len(manifest['parts']) == 34

          # The browser loads heart.js with this release-specific query value.
          # Verify the same URL, not a potentially older unversioned CDN response.
          built_page = (local / 'index.html').read_text(encoding='utf-8')
          release_match = re.search(r'\./heart\.js\?v=([0-9a-f]{12})', built_page)
          assert release_match, 'Missing versioned Hartslaglab script in release HTML'
          release = release_match.group(1)
          for name in ('heart.js', 'atlas-heart-rich.json', 'atlas-heart-rich.bin'):
              expected = hashlib.sha256((local / name).read_bytes()).hexdigest()
              url = 'https://eaimodel.nl/' + relative + name + '?v=' + release
              last_problem = ''
              for attempt in range(4):
                  try:
                      with release_open(url, timeout=70) as response:
                          assert response.status == 200, name
                          hasher = hashlib.sha256()
                          size = 0
                          while chunk := response.read(1024 * 1024):
                              size += len(chunk)
                              hasher.update(chunk)
                          actual = hasher.hexdigest()
                          encoding = response.headers.get('Content-Encoding', 'identity')
                      if actual == expected:
                          print(f'Hartslaglab live: {name}, bytes={size}, sha256={actual}, release={release}')
                          last_problem = ''
                          break
                      last_problem = (
                          f'{name}: expected={expected}, got={actual}, bytes={size}, '
                          f'encoding={encoding}, url={url}'
                      )
                  except Exception as exc:
                      last_problem = f'{name}: request failed: {type(exc).__name__}: {exc}'
                  print(f'Live Hartslaglab check {attempt+1}/4: {last_problem}', flush=True)
                  if attempt < 3:
                      time.sleep(4)
              if last_problem:
                  raise AssertionError('Live Hartslaglab verschilt: ' + last_problem)
          PY
      - name: Verify live anatomical models
        if: steps.deployment.outputs.id != ''
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          base = 'https://eaimodel.nl/tools/anatomie/'
          def release_open(url, timeout):
              return urlopen(Request(url, headers={
                  'User-Agent': 'EAI-release-check/1.0',
                  'Cache-Control': 'no-cache',
              }), timeout=timeout)
          with release_open(base, timeout=35) as response:
              assert response.status == 200
              assert b'Het lichaam in 3D' in response.read(120000)
          for system in ('skeletal', 'muscular', 'joints', 'cardiovascular',
                         'lymphatic', 'nervous', 'visceral'):
              with release_open(base + 'models/' + system + '.glb', timeout=40) as response:
                  assert response.status == 200, system
                  assert response.read(4) == b'glTF', system
          print('Online anatomische modellen gecontroleerd')
          PY

      - name: Registreer de uitkomst na de livecontroles
        if: always() && steps.deployment.outputs.id != ''
        env:
          ID: ${{ steps.deployment.outputs.id }}
          RESULT: ${{ job.status }}
        run: python scripts/release_deployment.py finish
