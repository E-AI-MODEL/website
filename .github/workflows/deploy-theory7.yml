name: Deploy to Theory7

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theory7-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp openssl

      - name: Verify Theory7 FTPS certificate fingerprint
        shell: bash
        env:
          HOST: ftp.eaimodel.nl
        run: |
          set -euo pipefail
          expected="4D:F5:15:4C:F3:11:5E:5B:DD:91:BD:5F:BD:0F:0E:A7:35:71:5C:32"
          actual="$(
            openssl s_client -starttls ftp -connect "$HOST:21" -servername "$HOST" </dev/null 2>/dev/null               | openssl x509 -noout -fingerprint -sha1               | cut -d= -f2
          )"
          echo "FTPS certificate fingerprint: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected FTPS certificate fingerprint."
            exit 1
          fi

      - name: Deploy static site via FTPS
        shell: bash
        env:
          HOST: ftp.eaimodel.nl
          FTP_USER: ${{ secrets.THEORY7_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.THEORY7_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$HOST:21" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:timeout 20
          set net:max-retries 1
          mirror -R --delete --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .gitignore \
            --exclude-glob README.md \
            --exclude-glob cgi-bin/ \
            --exclude-glob .well-known/ \
            ./ /
          bye
          EOF
