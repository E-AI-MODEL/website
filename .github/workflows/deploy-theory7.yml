name: Deploy to Theory7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theory7-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use Node.js 22 for the anatomical 3D atlas
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate the release to publish
        run: |
          pip install beautifulsoup4
          python scripts/build_site.py --sources content/legacy --out site-build
          python scripts/build_anatomie.py --out site-build/tools/anatomie
          python -m unittest discover -s tests -p 'test_anatomie_publish.py' -v
          python scripts/prepare_ui.py --root site-build
          python scripts/verify_ui.py --root site-build
      - name: Install FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp openssl
      - name: Verify Theory7 FTPS certificate fingerprint
        shell: bash
        env:
          HOST: ftp.eaimodel.nl
        run: |
          set -euo pipefail
          expected="4D:F5:15:4C:F3:11:5E:5B:DD:91:BD:5F:BD:0F:0E:A7:35:71:5C:32"
          actual="$(openssl s_client -starttls ftp -connect "$HOST:21" -servername "$HOST" </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected FTPS certificate fingerprint."
            exit 1
          fi
      - name: Publish assets before HTML
        shell: bash
        env:
          HOST: ftp.eaimodel.nl
          FTP_USER: ${{ secrets.THEORY7_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.THEORY7_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$HOST:21" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:timeout 20
          set net:max-retries 1
          set xfer:use-temp-file yes
          mirror -R --verbose site-build/assets/ /assets/
          # The general exclude-glob assets/ also excludes nested asset folders.
          # Publish the anatomical viewer's generated JS, CSS and Draco helpers
          # explicitly, before making its HTML visible to visitors.
          mirror -R --verbose site-build/tools/anatomie/assets/ /tools/anatomie/assets/
          mirror -R --verbose --exclude-glob assets/ --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .htaccess --exclude-glob cgi-bin/ --exclude-glob .well-known/ site-build/ /
          bye
          EOF
      - name: Verify live HTML and exact asset hashes
        run: python scripts/verify_ui.py --root site-build --url https://eaimodel.nl --timeout 90
      - name: Verify live anatomy JavaScript and stylesheets
        run: |
          python - <<'PY'
          import re
          from urllib.request import urlopen
          from pathlib import Path
          base = 'https://eaimodel.nl'
          html = urlopen(base + '/tools/anatomie/', timeout=30).read().decode('utf-8')
          for kind, pattern, expected in (
              ('javascript', r'<script[^>]+src="(/tools/anatomie/assets/[^"]+\\.js)"', ('javascript', 'ecmascript')),
              ('stylesheet', r'<link[^>]+href="(/tools/anatomie/assets/[^"]+\\.css)"', ('css',)),
          ):
              match = re.search(pattern, html)
              assert match, f'Live anatomy {kind} asset link missing'
              path = match.group(1)
              local = Path('site-build') / path.lstrip('/')
              assert local.is_file(), f'Build is missing {path}'
              with urlopen(base + path, timeout=35) as response:
                  content = response.read()
                  ct = response.headers.get('Content-Type', '').lower()
                  assert response.status == 200, (kind, response.status)
                  assert any(part in ct for part in expected), (kind, ct)
                  assert content == local.read_bytes(), (kind, 'Remote content differs')
              print(f'{kind}: {path} ({len(content)} bytes)')
          PY
      - name: Verify live anatomical models
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          base = 'https://eaimodel.nl/tools/anatomie/'
          with urlopen(base, timeout=35) as response:
              assert response.status == 200
              assert b'Anatomisch Observatorium' in response.read(120000)
          for system in ('skeletal', 'muscular', 'joints', 'cardiovascular',
                         'lymphatic', 'nervous', 'visceral'):
              with urlopen(base + 'models/' + system + '.glb', timeout=40) as response:
                  assert response.status == 200, system
                  assert response.read(4) == b'glTF', system
          print('Online anatomische modellen gecontroleerd')
          PY
