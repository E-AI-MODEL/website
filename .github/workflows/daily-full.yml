name: Dagelijkse volledige websitecontrole
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  website:
    uses: ./.github/workflows/site-check.yml
  real-model:
    uses: ./.github/workflows/llm-real-trace.yml
  cloudflare:
    uses: ./.github/workflows/verify-live-cloudflare.yml
  tracking:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install openpyxl py7zr
      - run: python tools/lo-aanvalslab/calibratie/v13/extract_tracking.py
      - uses: actions/upload-artifact@v4
        with:
          name: tracking-metingen
          path: tools/lo-aanvalslab/calibratie/v13/tracking_metrics.json
          if-no-files-found: error
  browsers:
    needs: website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checked-build
        with:
          reuse: 'true'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node scripts/ui_smoke.mjs site-build
        env:
          UI_BROWSER: ${{ matrix.engine }}
