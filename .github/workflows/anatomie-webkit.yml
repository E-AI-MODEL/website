name: Test anatomy in mobile WebKit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_anatomie.py'
      - 'scripts/anatomie_refine.py'
      - 'scripts/audit_anatomie_content.py'
      - 'tests/test_anatomie_content_audit.py'
      - 'scripts/anatomie_shell.py'
      - 'scripts/test_anatomie_webkit.mjs'
      - 'scripts/test_anatomie_teaching.mjs'
      - 'tests/test_anatomie_picking.mjs'
      - 'content/anatomie/**'
      - '.github/workflows/anatomie-webkit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build_anatomie.py'
      - 'scripts/anatomie_refine.py'
      - 'scripts/audit_anatomie_content.py'
      - 'tests/test_anatomie_content_audit.py'
      - 'scripts/anatomie_shell.py'
      - 'scripts/test_anatomie_webkit.mjs'
      - 'scripts/test_anatomie_teaching.mjs'
      - 'tests/test_anatomie_picking.mjs'
      - 'content/anatomie/**'
      - '.github/workflows/anatomie-webkit.yml'
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controleer anatomische inhoud en model-ID's
        run: python -m unittest discover -s tests -p 'test_anatomie_content_audit.py' -v
      - name: Schrijf volledige anatomie-audit
        run: python scripts/audit_anatomie_content.py --out audit-anatomie
      - name: Controleer Nederlandse uitleg voor alle modelonderdelen
        run: node scripts/test_anatomie_teaching.mjs
      - name: Controleer selectie van transparante fascia
        run: node --test tests/test_anatomie_picking.mjs
      - run: python scripts/build_anatomie.py --out site-build/tools/anatomie
      - run: npm install --no-save playwright@1.56.1
      - name: Install WebKit and browser dependencies
        run: npx playwright install --with-deps webkit
      - name: Verify anatomy on mobile WebKit
        run: node scripts/test_anatomie_webkit.mjs site-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-webkit-screenshot
          path: |
            test-results/anatomie-*.png
            audit-anatomie/*
