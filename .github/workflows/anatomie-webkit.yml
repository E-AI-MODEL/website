name: Test anatomy in mobile WebKit
on:
  workflow_call:
    inputs:
      reuse_build:
        type: boolean
        default: false
  workflow_dispatch:


permissions:
  contents: read
  actions: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controleer anatomische inhoud en model-ID's
        run: python -m unittest discover -s tests -p 'test_anatomie_content_audit.py' -v
      - name: Schrijf volledige anatomie-audit
        run: python scripts/audit_anatomie_content.py --out audit-anatomie
      - name: Controleer JavaScript van het Hartslaglab voor de browserstart
        run: node --check content/anatomie/labs/hartslag/heart.js
      - name: Controleer hartcyclus en kleplogica
        run: node scripts/test_hartslaglab_cycle.mjs
      - name: Controleer open hartkamers, kleppen en bloedvaten
        run: node scripts/test_hartslaglab_geometry.mjs
      - name: Inspecteer hartstructuren in bestaande 3D-atlas
        run: node scripts/audit_hart_glb.mjs
      - name: Controleer herkomst van de anatomische uitlegartikelen
        run: node scripts/test_anatomie_sources.mjs
      - name: Controleer Nederlandse uitleg voor alle modelonderdelen
        run: node scripts/test_anatomie_teaching.mjs
      - name: Controleer selectie van transparante fascia
        run: node --test tests/test_anatomie_picking.mjs
      - uses: ./.github/actions/checked-build
        with:
          reuse: ${{ inputs.reuse_build }}
      - run: npm install --no-save playwright@1.56.1
      - name: Install WebKit and browser dependencies
        run: npx playwright install --with-deps webkit
      - name: Verify anatomy on mobile WebKit
        run: node scripts/test_anatomie_webkit.mjs site-build
      - name: Hartslaglab bewegen en bedienen in mobiele WebKit
        run: node scripts/test_hartslaglab_browser.mjs site-build webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-webkit-screenshot-${{ github.run_attempt }}
          path: |
            test-results/anatomie-*.png
            test-results/hartslaglab-*.png
            audit-anatomie/*
