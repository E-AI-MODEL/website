name: Read-only branch backlog audit
on:
  push:
    branches: [audit/generated-source-ownership]
    paths:
      - .github/workflows/audit-branch-backlog.yml
      - scripts/audit_branch_backlog.py
      - scripts/review_branch_backlog.py
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Fetch branch tips and history
        run: git fetch --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Compare current and historical file states
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/review_branch_backlog.py --out branch-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: branch-recovery/
          if-no-files-found: error
          retention-days: 90
