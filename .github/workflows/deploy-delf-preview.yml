name: Publish DELF MacBook and mobile tests

# Alleen handmatige herstelpublicatie, naast de automatische algemene sitepublicatie.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read


jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout tested DELF version
        uses: actions/checkout@v4
        with:
          path: pinned-delf
          ref: 446e5e24929521f70c94092bd07cf959a0c92794

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and test DELF only
        run: |
          set -euo pipefail
          mkdir -p tools
          cp -R pinned-delf/tools/delf-live tools/delf-live
          npm install --prefix tools/delf-live --no-audit --no-fund
          npm run test --prefix tools/delf-live
          npm run build --prefix tools/delf-live
          test -s tools/delf-live/dist/index.html
          test -s tools/delf-live/dist/mobile-preview.html
          grep -q 'DELF · Franse modelproef' tools/delf-live/dist/mobile-preview.html
          test -d tools/delf-live/dist/assets
          grep -q 'DELF scolaire' tools/delf-live/dist/index.html

      # De gedeelde concurrency-groep serialiseert de publicatie al.

      - name: Leg de vooraf gecontroleerde overdrachtsbestanden vast
        run: python3 scripts/recovery_files.py create tools/delf-live/dist
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-files/
            recovery-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: prepare
    environment: theory7-herstel
    concurrency:
      group: theory7-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Controleer de goedkeuring van de eigenaar
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e --arg id "$OWNER_ID" 'any(.[]; .state == "approved" and (.user.id|tostring) == $id and any(.environments[]; .name == "theory7-herstel"))'
      - uses: actions/download-artifact@v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
      - run: python3 scripts/recovery_files.py verify
      - run: cp -a recovery-files/. .
      - name: Install FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp openssl

      - name: Verify Theory7 FTPS certificate
        shell: bash
        env:
          HOST: ftp.eaimodel.nl
        run: |
          set -euo pipefail
          expected="4D:F5:15:4C:F3:11:5E:5B:DD:91:BD:5F:BD:0F:0E:A7:35:71:5C:32"
          actual="$(openssl s_client -starttls ftp -connect "$HOST:21" -servername "$HOST" </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected FTPS certificate fingerprint"
            exit 1
          fi

      - name: Publish only DELF test folder
        shell: bash
        env:
          HOST: ftp.eaimodel.nl
          FTP_USER: ${{ secrets.THEORY7_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.THEORY7_FTP_PASSWORD }}
        working-directory: recovery-files
        run: |
          set -euo pipefail
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$HOST:21" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:timeout 20
          set net:max-retries 1
          set xfer:use-temp-file yes
          set net:connection-limit 4
          mkdir -p /tools/delf-live
          mirror -R --parallel=3 --verbose tools/delf-live/dist/ /tools/delf-live/
          bye
          EOF

      - name: Verify public test page and assets
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          from pathlib import Path
          import re
          import time
          base = 'https://eaimodel.nl/tools/delf-live/'
          expected = (Path('tools/delf-live/dist/index.html')).read_bytes()
          urls = re.findall(rb'(?:src|href)="([^"]+)"', expected)
          assets = [url.decode() for url in urls if b'/assets/' in url]
          assert assets, 'No Vite assets in the HTML'
          for attempt in range(12):
              try:
                  with urlopen(Request(base, headers={'Cache-Control':'no-cache','User-Agent':'DELF-preview-check/1.0'}), timeout=20) as res:
                      page = res.read()
                      assert res.status == 200
                  # Hosting may inject analytics or modify markup after upload.
                  # Check the app identity and exact versioned asset references instead.
                  title = re.search(rb'<title>[^<]+</title>', expected)
                  assert title, 'Built DELF app has no title'
                  markers = (title.group(0),
                             b'id="displayText"', b'id="speechText"')
                  if all(marker in page for marker in markers) and all(asset.encode() in page for asset in assets):
                      break
              except Exception as err:
                  print('Test page not ready:', err)
              time.sleep(5)
          else:
              raise SystemExit('Published DELF page missing or referencing different app assets')
          for asset in assets:
              local = Path('tools/delf-live/dist') / asset.lstrip('./')
              with urlopen(Request(urljoin(base, asset), headers={'Cache-Control':'no-cache','User-Agent':'DELF-preview-check/1.0'}), timeout=30) as res:
                  data = res.read()
                  assert res.status == 200
              assert data == local.read_bytes(), 'Asset differs: ' + asset
              print('OK:', asset, len(data), 'bytes')
          with urlopen(Request(base + 'mobile-preview.html', headers={'Cache-Control':'no-cache','User-Agent':'DELF-preview-check/1.0'}), timeout=30) as res:
              mobile_page = res.read()
              assert res.status == 200
          assert b'DELF' in mobile_page and b'Franse modelproef' in mobile_page
          assert b'/assets/' in mobile_page, 'Mobile model JS not linked'
          print('DELF MacBook and mobile pages publicly available at', base)
          PY
